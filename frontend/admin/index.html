<!DOCTYPE html>
<html lang="en" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniVault — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <main class="container auth-wrap">
    <div class="auth-card reveal">
      <div class="admin-badge">🔐 Admin</div>
      <h1>Admin login</h1>
      <p class="auth-sub">Restricted area. Enter the admin password.</p>

      <form id="admin-login-form">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Enter dashboard</button>
      </form>

      <p class="auth-alt"><a href="../">← Back to site</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script>
    (function () {
      // Already logged in?
      if (getAdminToken()) {
        location.href = './dashboard.html';
        return;
      }

      const form = document.getElementById('admin-login-form');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const password = document.getElementById('password').value;
        if (!password) return;

        btn.disabled = true;
        btn.textContent = 'Checking…';

        try {
          await adminLogin(password);
          location.href = './dashboard.html';
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Enter dashboard';
          toast(err.message, 'error');
        }
      });
    })();
  </script>
</body>
</html>
