<!DOCTYPE html>
<html lang="en" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studora — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .admin-layout { padding-top: 26px; }

    /* ---------- Top bar ---------- */
    .admin-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 22px;
      backdrop-filter: blur(10px);
    }
    .admin-bar-brand { display: flex; align-items: center; gap: 12px; }
    .admin-bar-brand .brand-mark { width: 40px; height: 40px; font-size: 0.95rem; }
    .admin-bar-title strong { display: block; font-size: 1.05rem; line-height: 1.2; }
    .admin-bar-title small { color: var(--muted); font-size: 0.78rem; font-weight: 600; }

    /* ---------- Tabs ---------- */
    .tabs {
      display: flex; gap: 8px; flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      margin-bottom: 22px;
    }
    .tab {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 15px;
      border: none; border-radius: 10px;
      background: transparent; color: var(--muted);
      font: 600 13px 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    }
    .tab:hover { background: var(--accent-soft); color: var(--text); }
    .tab.active { background: linear-gradient(135deg, var(--accent), #0a6b46); color: #fff; box-shadow: 0 4px 14px rgba(14, 122, 78, 0.35); }
    .tab svg { width: 15px; height: 15px; opacity: 0.85; }
    .tab.active svg { opacity: 1; }
    .tab .count-pill {
      background: #ef4444; color: #fff; border-radius: 99px;
      padding: 1px 8px; font-size: 11px; font-weight: 800; line-height: 1.6;
    }
    .tab.active .count-pill { background: rgba(255, 255, 255, 0.92); color: #b91c1c; }

    /* ---------- Cards ---------- */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    .panel-head {
      display: flex; align-items: center; gap: 10px;
      margin: -4px 0 16px;
    }
    .panel-head .p-ic {
      width: 36px; height: 36px; border-radius: 10px;
      display: grid; place-items: center;
      color: var(--accent); background: var(--accent-soft);
      border: 1px solid rgba(14, 122, 78, 0.25);
    }
    .panel-head .p-ic svg { width: 18px; height: 18px; }
    .panel-head h3 { margin: 0; font-size: 1.05rem; }
    .panel-head p { margin: 0; color: var(--muted); font-size: 0.83rem; }

    /* ---------- Stats ---------- */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px; margin-bottom: 22px;
    }
    .stat {
      position: relative; overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .stat:hover { transform: translateY(-3px); border-color: rgba(14, 122, 78, 0.45); box-shadow: var(--shadow); }
    .stat::after {
      content: ''; position: absolute; top: -34px; right: -34px;
      width: 90px; height: 90px; border-radius: 50%;
      background: var(--accent-soft);
    }
    .stat b { display: block; font-size: 1.8rem; font-weight: 800; line-height: 1.15; }
    .stat span { color: var(--muted); font-size: 0.83rem; font-weight: 600; }
    .stat.danger b { color: var(--danger); }
    .stat.danger::after { background: rgba(214, 69, 69, 0.09); }

    /* ---------- List rows (requests / applications) ---------- */
    .req-row {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.5);
      margin-bottom: 10px;
      animation: row-in 0.28s ease;
      transition: border-color 0.2s, background 0.2s;
    }
    .req-row:hover { border-color: rgba(14, 122, 78, 0.4); background: rgba(255, 255, 255, 0.85); }
    .req-row.approving { border-color: rgba(34, 197, 94, 0.6); background: rgba(34, 197, 94, 0.05); }
    .req-row.rejecting { border-color: rgba(239, 68, 68, 0.6); background: rgba(239, 68, 68, 0.05); }
    @keyframes row-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .req-main { display: flex; gap: 13px; align-items: flex-start; min-width: 240px; flex: 1; }
    .req-avatar {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
      display: grid; place-items: center;
      font-weight: 800; font-size: 0.95rem; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 5px 14px rgba(14, 122, 78, 0.25);
    }
    .req-who { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
    .req-meta { color: var(--muted); font-size: 0.83rem; }
    .req-note { color: var(--text); font-size: 0.87rem; margin-top: 3px; opacity: 0.85; }
    .req-side { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .req-date { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }

    /* ---------- Buttons ---------- */
    .btn-sm { padding: 6px 13px; font-size: 12.5px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s, filter 0.2s; }
    .btn-sm:active { transform: scale(0.96); }
    .btn-sm.ok { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; }
    .btn-sm.ok:hover { filter: brightness(1.08); box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35); }
    .btn-sm.danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .btn-sm.danger:hover { filter: brightness(1.08); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35); }
    .btn-sm.ghost2 { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-sm.ghost2:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm.featured { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }

    .pill { display: inline-block; border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.02em; }
    .pill.pending { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b55; }
    .pill.approved { background: #22c55e22; color: #22c55e; border: 1px solid #22c55e55; }
    .pill.rejected { background: #ef444422; color: #ef4444; border: 1px solid #ef444455; }

    /* ---------- Tables ---------- */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
    .table-wrap table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
    .table-wrap th, .table-wrap td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .table-wrap th { background: var(--bg-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .table-wrap tr:last-child td { border-bottom: none; }
    .table-wrap tbody tr { transition: background 0.15s; }
    .table-wrap tbody tr:hover { background: var(--accent-soft); }
    .table-wrap tbody tr:last-child td { border-bottom: none; }

    /* ---------- Forms ---------- */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid label { grid-column: 1 / -1; margin-bottom: -6px; }
    .admin-layout select, .admin-layout input, .admin-layout textarea {
      width: 100%; padding: 10px 13px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 9px; color: var(--text);
      font: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .admin-layout select:focus, .admin-layout input:focus, .admin-layout textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14, 122, 78, 0.15);
    }
    .admin-layout label { font-size: 0.8rem; font-weight: 700; color: var(--muted); }

    .empty { padding: 34px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; }
    .loading-row { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 26px; color: var(--muted); font-weight: 600; }
    .service-badge { margin-left: 6px; font-size: 12px; }
    .back-site { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="container admin-layout">
    <div class="admin-bar">
      <div class="admin-bar-brand">
        <span class="brand-mark">S</span>
        <div class="admin-bar-title">
          <strong>Studora <span data-i18n="nav.admin"></span></strong>
          <small>Manage universities, fields, services & requests</small>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="theme-toggle" onclick="__toggleTheme()" aria-label="Toggle theme"></button>
        <a class="back-site" href="../">← <span data-i18n="admin.back"></span></a>
        <button class="btn btn-ghost" onclick="logoutAdmin()" style="padding:7px 14px;font-size:0.85rem" data-i18n="nav.logout"></button>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="overview"><span data-i18n="adm.overview"></span></button>
      <button class="tab" data-tab="access-requests"><span data-i18n="adm.requests"></span> <span class="count-pill" id="pill-requests" hidden>0</span></button>
      <button class="tab" data-tab="applications"><span data-i18n="adm.applications"></span> <span class="count-pill" id="pill-applications" hidden>0</span></button>
      <button class="tab" data-tab="universities"><span data-i18n="adm.universities"></span></button>
      <button class="tab" data-tab="fields"><span data-i18n="adm.fields"></span></button>
      <button class="tab" data-tab="services"><span data-i18n="adm.services"></span></button>
      <button class="tab" data-tab="resources"><span data-i18n="adm.resources"></span></button>
      <button class="tab" data-tab="users"><span data-i18n="adm.users"></span></button>
      <button class="tab" data-tab="audit"><span data-i18n="adm.audit"></span></button>
    </div>

    <div id="tab-content"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script>
    requireAdminAuth();
    bindModalClose();

    const content = document.getElementById('tab-content');
    let activeTab = 'overview';

    // ---- Tab switching ----
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        activeTab = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        renderTab(activeTab);
      });
    });

    async function renderTab(tab) {
      const fns = {
        'overview': renderOverview,
        'access-requests': renderAccessRequests,
        'applications': renderApplications,
        'universities': renderUniversities,
        'fields': renderFields,
        'services': renderServices,
        'resources': renderResources,
        'users': renderUsers,
        'audit': renderAudit
      };
      const fn = fns[tab] || renderOverview;
      content.innerHTML = '<div class="loading-row"><span class="spinner dark"></span> Loading…</div>';
      try {
        await fn();
      } catch (err) {
        content.innerHTML = '<div class="error-panel">' + escapeHTML(err.message) + '</div>';
      }
    }

    // =====================================================================
    // Overview
    // =====================================================================
    async function renderOverview() {
      const s = await adminFetch('/api/admin/summary');
      content.innerHTML =
        '<div class="stat-grid">' +
        stat(s.universities, 'Universities') +
        stat(s.fields, 'Fields') +
        stat(s.services, 'Services') +
        stat(s.users, 'Users') +
        (s.pendingAccessRequests > 0 ? stat(s.pendingAccessRequests, 'Pending access requests', 'danger') : stat(0, 'Pending access requests')) +
        (s.pendingServiceApplications > 0 ? stat(s.pendingServiceApplications, 'Pending applications', 'danger') : stat(0, 'Pending applications')) +
        '</div>' +
        '<div class="panel"><div class="panel-head"><div class="p-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><div><h3>Quick actions</h3><p>Use the tabs above to manage content. Pending counts appear as red pills on the tab buttons.</p></div></div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn btn-primary" onclick="requireTab(\'access-requests\')">Review access requests</button>' +
        '<button class="btn btn-ghost" onclick="requireTab(\'applications\')">Review applications</button>' +
        '</div></div>';
      document.getElementById('pill-requests').hidden = s.pendingAccessRequests === 0;
      document.getElementById('pill-requests').textContent = s.pendingAccessRequests;
      document.getElementById('pill-applications').hidden = s.pendingServiceApplications === 0;
      document.getElementById('pill-applications').textContent = s.pendingServiceApplications;
    }

    function requireTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === tab); });
      renderTab(tab);
    }

    function stat(value, label, tone) {
      const color = tone === 'danger' && value > 0 ? 'color:#ef4444' : '';
      return '<div class="stat ' + (tone === 'danger' && value > 0 ? 'danger' : '') + '"><b>' + value + '</b><span>' + label + '</span></div>';
    }

    // =====================================================================
    // Access Requests — in-place status flips, no refresh needed
    // =====================================================================
    async function renderAccessRequests() {
      const rows = await adminFetch('/api/admin/access-requests');
      if (!rows || rows.length === 0) { content.innerHTML = '<div class="empty">No access requests yet.</div>'; return; }

      content.innerHTML = rows.map(function (r) {
        const student = (r.profiles && r.profiles.username) || r.user_id;
        const service = (r.services && r.services.title) || r.service_id;
        const note = r.payment_note ? escapeHTML(r.payment_note) : '<span class="req-note" style="opacity:.5">No payment note</span>';
        const actions = r.status === 'pending'
          ? '<button class="btn-sm ok" id="apr-' + r.id + '" onclick="approveRequest(\'' + r.id + '\', this)">Approve</button> ' +
            '<button class="btn-sm danger" id="rej-' + r.id + '" onclick="rejectRequest(\'' + r.id + '\', this)">Reject</button>'
          : '<span style="color:var(--muted);font-size:.8rem">—</span>';
        return '<div class="req-row" id="row-' + r.id + '">' +
          '<div class="req-main">' +
          '  <div class="req-avatar">' + escapeHTML((student || '?').charAt(0).toUpperCase()) + '</div>' +
          '  <div><div class="req-who">' + escapeHTML(student) + '</div>' +
          '  <div class="req-meta">' + escapeHTML(service) + '</div>' +
          '  <div class="req-note">' + note + '</div></div>' +
          '</div>' +
          '<div class="req-side">' +
          '  <span class="pill ' + r.status + '" id="pill-' + r.id + '">' + r.status + '</span>' +
          '  <div style="display:flex;gap:8px" id="row-actions-' + r.id + '">' + actions + '</div>' +
          '  <span class="req-date">' + escapeHTML(new Date(r.requested_at).toLocaleString()) + '</span>' +
          '</div></div>';
      }).join('');
    }

    function flipRequestStatus(id, status) {
      const pill = document.getElementById('pill-' + id);
      if (pill) { pill.className = 'pill ' + status; pill.textContent = status; }
      const actions = document.getElementById('row-actions-' + id);
      if (actions) actions.innerHTML = '<span style="color:var(--muted);font-size:.8rem" class="just-done">' + (status === 'approved' ? '✓ Done' : '✕ Done') + '</span>';
      const row = document.getElementById('row-' + id);
      if (row) row.classList.add(status === 'approved' ? 'approving' : 'rejecting');
      const pillCount = document.getElementById('pill-requests');
      if (pillCount && !pillCount.hidden) {
        const n = parseInt(pillCount.textContent, 10) - 1;
        if (n <= 0) pillCount.hidden = true; else pillCount.textContent = n;
      }
    }

    window.approveRequest = async function (id, btn) {
      setBusy(btn, true);
      const row = document.getElementById('row-' + id);
      try {
        await adminFetch('/api/admin/access-requests/' + id + '/approve', { method: 'POST' });
        flipRequestStatus(id, 'approved');
        toast('Access granted — student notified.', 'success');
        setTimeout(function () { renderTab('access-requests'); }, 1200);
      } catch (err) {
        if (row) row.classList.remove('approving');
        setBusy(btn, false);
        toast(err.message, 'error');
      }
    };

    window.rejectRequest = async function (id, btn) {
      setBusy(btn, true);
      const row = document.getElementById('row-' + id);
      try {
        await adminFetch('/api/admin/access-requests/' + id + '/reject', { method: 'POST' });
        flipRequestStatus(id, 'rejected');
        toast('Request rejected.', 'success');
        setTimeout(() => renderTab('access-requests'), 1200);
      } catch (err) {
        if (row) row.classList.remove('rejecting');
        setBusy(btn, false);
        toast(err.message, 'error');
      }
    };

    // =====================================================================
    // Service Applications
    // =====================================================================
    async function renderApplications() {
      const rows = await adminFetch('/api/admin/service-applications');
      if (!rows || rows.length === 0) { content.innerHTML = '<div class="empty">No service applications yet.</div>'; return; }

      content.innerHTML = rows.map(function (a) {
        const applicant = (a.profiles && a.profiles.username) || a.applicant_id;
        const uni = (a.universities && a.universities.name) || '';
        const field = (a.fields && a.fields.name) || '';
        const desc = a.proposed_description ? escapeHTML(a.proposed_description.slice(0, 140) + (a.proposed_description.length > 140 ? '…' : '')) : '<span style="color:var(--muted)">—</span>';
        const actions = a.status === 'pending'
          ? '<button class="btn-sm ok" id="apa-' + a.id + '" onclick="approveApplication(\'' + a.id + '\', this)">Approve</button> ' +
            '<button class="btn-sm danger" id="rea-' + a.id + '" onclick="rejectApplication(\'' + a.id + '\', this)">Reject</button>'
          : '<span style="color:var(--muted);font-size:.8rem">' + (a.admin_notes ? escapeHTML(a.admin_notes) : '—') + '</span>';
        return '<div class="req-row" id="row-app-' + a.id + '">' +
          '<div class="req-main">' +
          '  <div class="req-avatar" style="background:linear-gradient(135deg,#0d9488,#0e7a4e)">' + escapeHTML((applicant || '?').charAt(0).toUpperCase()) + '</div>' +
          '  <div style="min-width:0">' +
          '    <div class="req-who"' + '>' + escapeHTML(applicant) + ' · <span style="color:var(--muted);font-weight:600;font-size:.82rem">' + escapeHTML(uni) + (field ? ' / ' + escapeHTML(field) : '') + '</span></div>' +
          '    <div class="req-meta" style="font-weight:600;font-size:.95rem;color:var(--text)">' + escapeHTML(a.proposed_title) + '</div>' +
          '    <div class="req-note">' + desc + '</div>' +
          '  </div>' +
          '</div>' +
          '<div class="req-side">' +
          '  <span class="pill pending" style="border-color:rgba(14,122,78,.3);background:rgba(14,122,78,.08);color:var(--accent)">' + escapeHTML(formatPrice(a.proposed_price)) + '</span>' +
          '  <span class="pill ' + a.status + '" id="pill-app-' + a.id + '">' + a.status + '</span>' +
          '  <span style="display:flex;gap:6px" id="row-app-actions-' + a.id + '">' + actions + '</span>' +
          '</div></div>';
      }).join('');
    }

    function flipApplicationStatus(id, status) {
      const pill = document.getElementById('pill-app-' + id);
      if (pill) { pill.className = 'pill ' + status; pill.textContent = status; }
      const actionsWrap = document.getElementById('row-app-actions-' + id);
      if (actionsWrap) actionsWrap.innerHTML = '<span style="color:var(--muted);font-size:.8rem">' + (status === 'approved' ? '✓ live now' : '✕ done') + '</span>';
      const row = document.getElementById('row-app-' + id);
      if (row) row.classList.add(status === 'approved' ? 'approving' : 'rejecting');
      const pillCount = document.getElementById('pill-applications');
      if (pillCount && !pillCount.hidden) {
        const n = parseInt(pillCount.textContent, 10) - 1;
        if (n <= 0) pillCount.hidden = true; else pillCount.textContent = n;
      }
    }

    window.approveApplication = async function (id, btn) {
      setBusy(btn, true);
      try {
        await adminFetch('/api/admin/service-applications/' + id + '/approve', { method: 'POST' });
        flipApplicationStatus(id, 'approved');
        toast('Application approved — service is live.', 'success');
        setTimeout(() => renderTab('applications'), 1200);
      } catch (err) {
        setBusy(btn, false);
        toast(err.message, 'error');
      }
    };

    window.rejectApplication = async function (id, btn) {
      const note = prompt('Optional note to the applicant (e.g. reason):');
      if (note === null) return;
      setBusy(btn, true);
      try {
        await adminFetch('/api/admin/service-applications/' + id + '/reject', {
          method: 'POST',
          body: JSON.stringify({ admin_notes: note })
        });
        flipApplicationStatus(id, 'rejected');
        toast('Application rejected.', 'success');
        setTimeout(() => renderTab('applications'), 1200);
      } catch (err) {
        setBusy(btn, false);
        toast(err.message, 'error');
      }
    };

    // =====================================================================
    // Universities CRUD
    // =====================================================================
    async function renderUniversities() {
      const rows = await adminFetch('/api/admin/universities');
      content.innerHTML =
        '<div class="panel">' +
        '  <div class="panel-head"><div class="p-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/></svg></div><div><h3>Add a university</h3><p>Create a new campus</p></div></div>' +
        '  <form id="uni-form" class="form-grid">' +
        '    <label>Name</label><input name="name" required placeholder="e.g. Example University">' +
        '    <label>Slug</label><input name="slug" required placeholder="e.g. example-uni">' +
        '    <label>Type</label><input name="type" required placeholder="e.g. Public University">' +
        '    <label>Description</label><input name="description" placeholder="Optional">' +
        '    <button type="submit" id="uni-submit" class="btn btn-primary full">Add university</button>' +
        '  </form>' +
        '</div>' +
        tableWrap('<table><thead><tr><th>Name</th><th>Slug</th><th>Type</th><th style="text-align:right">Actions</th></tr></thead><tbody>' +
        rows.map(function (u) {
          return '<tr><td><strong>' + escapeHTML(u.name) + '</strong></td>' +
            '<td><code>' + escapeHTML(u.slug) + '</code></td>' +
            '<td>' + escapeHTML(u.type) + '</td>' +
            '<td style="text-align:right;white-space:nowrap"><button class="btn-sm ghost2" onclick="editUniversity(\'' + u.id + '\')">Edit</button> ' +
            '<button class="btn-sm danger" onclick="delUniversity(\'' + u.id + '\', this)">Delete</button></td></tr>';
        }).join('') + '</tbody></table>');

      document.getElementById('uni-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const f = e.target;
        const submitBtn = document.getElementById('uni-submit');
        const body = { name: formVal(f, 'name'), slug: formVal(f, 'slug'), type: formVal(f, 'type'), description: formVal(f, 'description') };
        setBusy(submitBtn, true);
        try {
          if (f.dataset.id) {
            await adminFetch('/api/admin/universities/' + f.dataset.id, { method: 'PUT', body: JSON.stringify(body) });
            toast('University updated.', 'success');
          } else {
            await adminFetch('/api/admin/universities', { method: 'POST', body: JSON.stringify(body) });
            toast('University added.', 'success');
          }
          renderTab('universities');
        } catch (err) { setBusy(submitBtn, false); toast(err.message, 'error'); }
      });
    }

    window.editUniversity = async function (id) {
      const rows = await adminFetch('/api/admin/universities');
      const u = rows.find(function (x) { return x.id === id; });
      if (!u) return;
      const form = document.getElementById('uni-form');
      form.dataset.id = id;
      form.elements['name'].value = u.name;
      form.elements['slug'].value = u.slug;
      form.elements['type'].value = u.type;
      form.elements['description'].value = u.description || '';
      form.querySelector('button[type=submit]').textContent = 'Save changes';
    };

    window.delUniversity = async function (id, btn) {
      if (!confirm('Delete this university and everything under it?')) return;
      setBusy(btn, true);
      try {
        await adminFetch('/api/admin/universities/' + id, { method: 'DELETE' });
        toast('University deleted.', 'success');
        renderTab('universities');
      } catch (err) { setBusy(btn, false); toast(err.message, 'error'); }
    };

    // =====================================================================
    // Fields CRUD
    // =====================================================================
    async function renderFields() {
      const [fields, unis] = await Promise.all([
        adminFetch('/api/admin/fields'),
        adminFetch('/api/admin/universities')
      ]);
      content.innerHTML =
        '<div class="panel">' +
        '  <div class="panel-head"><div class="p-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div><div><h3>Add a field</h3><p>Link a field to a university</p></div></div>' +
        '  <form id="field-form" class="form-grid">' +
        '    <label>University</label><select name="university_id">' + unis.map(function (u) { return '<option value="' + u.id + '">' + escapeHTML(u.name) + '</option>'; }).join('') + '</select>' +
        '    <label>Name</label><input name="name" required placeholder="e.g. Computer Engineering">' +
        '    <label>Slug</label><input name="slug" required placeholder="e.g. computer-engineering">' +
        '    <label>Theme</label><select name="theme"><option value="default">Default</option><option value="cyber">Cyber (UCAS Cybersecurity)</option></select>' +
        '    <label>Description</label><input name="description" placeholder="Optional">' +
        '    <button type="submit" id="field-submit" class="btn btn-primary full">Add field</button>' +
        '  </form>' +
        '</div>' +
        tableWrap('<table><thead><tr><th>Name</th><th>Slug</th><th>Theme</th><th>University</th><th style="text-align:right">Actions</th></tr></thead><tbody>' +
        fields.map(function (f) {
          const uni = unis.find(function (u) { return u.id === f.university_id; });
          const theme = f.theme === 'cyber' ? '<span class="pill rejected">cyber</span>' : '<span class="pill approved">default</span>';
          return '<tr><td><strong>' + escapeHTML(f.name) + '</strong></td><td><code>' + escapeHTML(f.slug) + '</code></td><td>' + theme + '</td>' +
            '<td>' + escapeHTML(uni ? uni.name : '—') + '</td>' +
            '<td style="text-align:right;white-space:nowrap"><button class="btn-sm ghost2" onclick="editField(\'' + f.id + '\')">Edit</button> ' +
            '<button class="btn-sm danger" onclick="delField(\'' + f.id + '\', this)">Delete</button></td></tr>';
        }).join('') + '</tbody></table>');

      document.getElementById('field-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const f = e.target;
        const submitBtn = document.getElementById('field-submit');
        const body = { university_id: formVal(f, 'university_id'), name: formVal(f, 'name'), slug: formVal(f, 'slug'), theme: formVal(f, 'theme'), description: formVal(f, 'description') };
        setBusy(submitBtn, true);
        try {
          if (f.dataset.id) {
            await adminFetch('/api/admin/fields/' + f.dataset.id, { method: 'PUT', body: JSON.stringify(body) });
            toast('Field updated.', 'success');
          } else {
            await adminFetch('/api/admin/fields', { method: 'POST', body: JSON.stringify(body) });
            toast('Field added.', 'success');
          }
          renderTab('fields');
        } catch (err) { setBusy(submitBtn, false); toast(err.message, 'error'); }
      });
    }

    window.editField = async function (id) {
      const [fields, unis] = await Promise.all([adminFetch('/api/admin/fields'), adminFetch('/api/admin/universities')]);
      const f = fields.find(function (x) { return x.id === id; });
      if (!f) return;
      const form = document.getElementById('field-form');
      form.dataset.id = id;
      form.elements['university_id'].value = f.university_id;
      form.elements['name'].value = f.name;
      form.elements['slug'].value = f.slug;
      form.elements['theme'].value = f.theme || 'default';
      form.elements['description'].value = f.description || '';
      document.getElementById('field-submit').textContent = 'Save changes';
    };

    window.delField = async function (id, btn) {
      if (!confirm('Delete this field and all its services?')) return;
      setBusy(btn, true);
      try {
        await adminFetch('/api/admin/fields/' + id, { method: 'DELETE' });
        toast('Field deleted.', 'success');
        renderTab('fields');
      } catch (err) { setBusy(btn, false); toast(err.message, 'error'); }
    };

    // =====================================================================
    // Services CRUD
    // =====================================================================
    async function renderServices() {
      const [services, fields, unis] = await Promise.all([
        adminFetch('/api/admin/services'),
        adminFetch('/api/admin/fields'),
        adminFetch('/api/admin/universities')
      ]);
      content.innerHTML =
        '<div class="panel">' +
        '  <div class="panel-head"><div class="p-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></div><div><h3>Add a service</h3><p>Attach a service to a field</p></div></div>' +
        '  <form id="service-form" class="form-grid">' +
        '    <label>Field</label><select name="field_id">' + fields.map(function (f) {
          const uni = unis.find(function (u) { return u.id === f.university_id; });
          return '<option value="' + f.id + '">' + escapeHTML((uni ? uni.name + ' — ' : '') + f.name) + '</option>';
        }).join('') + '</select>' +
        '    <label>Title</label><input name="title" required placeholder="e.g. Network Security homework help">' +
        '    <label>Price (ILS)</label><input name="price" type="number" min="0" step="0.01" required placeholder="50">' +
        '    <label>Active</label><select name="is_active"><option value="true">Yes</option><option value="false">No</option></select>' +
        '    <label>Description</label><textarea name="description" rows="2" class="full" placeholder="Optional"></textarea>' +
        '    <button type="submit" id="service-submit" class="btn btn-primary full">Add service</button>' +
        '  </form>' +
        '</div>' +
        tableWrap('<table><thead><tr><th>Title</th><th>Field</th><th>Price</th><th>Active</th><th>Most bought</th><th style="text-align:right">Actions</th></tr></thead><tbody>' +
        services.map(function (s) {
          const f = fields.find(function (x) { return x.id === s.field_id; });
          const fname = f ? f.name : '—';
          const active = s.is_active ? '<span class="pill approved">yes</span>' : '<span class="pill rejected">no</span>';
          const featured = s.is_featured ? '<span class="pill approved">★ yes</span>' : '<span class="pill pending">no</span>';
          return '<tr><td><strong>' + escapeHTML(s.title) + '</strong></td><td>' + escapeHTML(fname) + '</td>' +
            '<td>' + escapeHTML(formatPrice(s.price)) + '</td><td>' + active + '</td>' +
            '<td><button class="btn-sm ' + (s.is_featured ? 'featured' : 'ghost2') + '" onclick="toggleFeatured(\'' + s.id + '\', this)">' + (s.is_featured ? '★ Remove' : '☆ Feature') + '</button></td>' +
            '<td style="text-align:right;white-space:nowrap"><button class="btn-sm ghost2" onclick="editService(\'' + s.id + '\')">Edit</button> ' +
            '<button class="btn-sm danger" onclick="delService(\'' + s.id + '\', this)">Delete</button></td></tr>';
        }).join('') + '</tbody></table>');

      document.getElementById('service-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const f = e.target;
        const submitBtn = document.getElementById('service-submit');
        const body = {
          field_id: formVal(f, 'field_id'),
          title: formVal(f, 'title'),
          description: formVal(f, 'description'),
          price: parseFloat(formVal(f, 'price')),
          is_active: formVal(f, 'is_active') === 'true'
        };
        setBusy(submitBtn, true);
        try {
          if (f.dataset.id) {
            await adminFetch('/api/admin/services/' + f.dataset.id, { method: 'PUT', body: JSON.stringify(body) });
            toast('Service updated.', 'success');
          } else {
            await adminFetch('/api/admin/services', { method: 'POST', body: JSON.stringify(body) });
            toast('Service added.', 'success');
          }
          renderTab('services');
        } catch (err) { setBusy(submitBtn, false); toast(err.message, 'error'); }
      });
    }

    window.editService = async function (id) {
      const [services, fields] = await Promise.all([adminFetch('/api/admin/services'), adminFetch('/api/admin/fields')]);
      const s = services.find(function (x) { return x.id === id; });
      if (!s) return;
      const form = document.getElementById('service-form');
      form.dataset.id = id;
      form.elements['field_id'].value = s.field_id;
      form.elements['title'].value = s.title;
      form.elements['description'].value = s.description || '';
      form.elements['price'].value = s.price;
      form.elements['is_active'].value = String(!!s.is_active);
      document.getElementById('service-submit').textContent = 'Save changes';
    };

    window.delService = async function (id, btn) {
      if (!confirm('Delete this service and its files?')) return;
      setBusy(btn, true);
      try {
        await adminFetch('/api/admin/services/' + id, { method: 'DELETE' });
        toast('Service deleted.', 'success');
        renderTab('services');
      } catch (err) { setBusy(btn, false); toast(err.message, 'error'); }
    };

    window.toggleFeatured = async function (id, btn) {
      const services = await adminFetch('/api/admin/services');
      const s = services.find(function (x) { return x.id === id; });
      if (!s) return;
      setBusy(btn, true);
      const before = !!s.is_featured;
      try {
        await adminFetch('/api/admin/services/' + id, {
          method: 'PUT',
          body: JSON.stringify({
            field_id: s.field_id,
            title: s.title,
            description: s.description,
            price: Number(s.price),
            is_active: s.is_active,
            is_featured: !before
          })
        });
        toast(before ? 'Removed from Most bought.' : 'Added to Most bought.', 'success');
        renderTab('services');
      } catch (err) { setBusy(btn, false); toast(err.message, 'error'); }
    };

    // =====================================================================
    // Resources (§14) — pick a service, then manage its files/links
    // =====================================================================
    let currentServiceResources = null;

    async function renderResources() {
      const [services, fields, unis] = await Promise.all([
        adminFetch('/api/admin/services'),
        adminFetch('/api/admin/fields'),
        adminFetch('/api/admin/universities')
      ]);

      content.innerHTML =
        '<div class="panel">' +
        '  <div class="panel-head"><div class="p-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></div><div><h3>Choose a service</h3><p>Then add files or links to it</p></div></div>' +
        '  <select id="res-service-select" style="width:100%;max-width:480px">' +
        '    <option value="">— select a service —</option>' +
        services.map(function (s) {
          const f = fields.find(function (x) { return x.id === s.field_id; });
          const uni = f ? unis.find(function (u) { return u.id === f.university_id; }) : null;
          return '<option value="' + s.id + '">' + escapeHTML((uni ? uni.name + ' / ' : '') + (f ? f.name + ' / ' : '') + s.title) + '</option>';
        }).join('') +
        '  </select>' +
        '</div>' +
        '<div id="res-panel"></div>';

      const select = document.getElementById('res-service-select');
      select.addEventListener('change', async function () {
        currentServiceResources = select.value || null;
        await renderResourcePanel(select.value);
      });
      if (currentServiceResources) {
        select.value = currentServiceResources;
        await renderResourcePanel(currentServiceResources);
      }
    }

    async function renderResourcePanel(serviceId) {
      const panel = document.getElementById('res-panel');
      if (!serviceId) { panel.innerHTML = ''; return; }

      const resources = await adminFetch('/api/admin/resources?service_id=' + encodeURIComponent(serviceId));

      panel.innerHTML =
        '<div class="panel">' +
        '  <div class="panel-head"><div class="p-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div><h3>Add a resource</h3><p>Upload a file (PDF, DOCX, PPTX, XLSX, ZIP, images — max 25MB) or link one</p></div></div>' +
        '  <form id="res-form" style="display:grid;gap:12px">' +
        '    <label>Title</label><input name="title" required placeholder="e.g. Project Report (PDF)">' +
        '    <div class="form-grid" style="grid-template-columns:1fr 1fr">' +
        '      <div><label>Upload a file</label><input name="file" type="file"></div>' +
        '      <div><label>…or an external link</label><input name="external_link" placeholder="https://…"></div>' +
        '    </div>' +
        '    <button type="submit" id="res-submit" class="btn btn-primary" style="justify-self:start">Add resource</button>' +
        '  </form>' +
        '</div>' +
        (resources.length === 0 ? '<div class="empty">No resources for this service yet.</div>' :
        tableWrap('<table><thead><tr><th>Title</th><th>Type</th><th style="text-align:right">Actions</th></tr></thead><tbody>' +
        resources.map(function (r) {
          const type = r.external_link ? 'external link' : (r.file_type || 'file');
          return '<tr><td><strong>' + escapeHTML(r.title) + '</strong></td><td>' + escapeHTML(type) + '</td>' +
            '<td style="text-align:right"><button class="btn-sm danger" onclick="delResource(\'' + r.id + '\', this)">Delete</button></td></tr>';
        }).join('') + '</tbody></table>'));

      document.getElementById('res-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const f = e.target;
        const submitBtn = document.getElementById('res-submit');
        const formData = new FormData();
        formData.append('service_id', serviceId);
        formData.append('title', formVal(f, 'title'));
        if (f.elements['file'].files && f.elements['file'].files[0]) formData.append('file', f.elements['file'].files[0]);
        if (f.elements['external_link'] && f.elements['external_link'].value) formData.append('external_link', formVal(f, 'external_link'));
        setBusy(submitBtn, true);
        try {
          await adminFetch('/api/admin/resources', { method: 'POST', body: formData });
          toast('Resource added.', 'success');
          await renderResourcePanel(serviceId);
        } catch (err) {
          setBusy(submitBtn, false);
          toast(err.message, 'error');
        }
      });
    }

    window.delResource = async function (id, btn) {
      if (!confirm('Delete this resource?')) return;
      setBusy(btn, true);
      try {
        await adminFetch('/api/admin/resources/' + id, { method: 'DELETE' });
        toast('Resource deleted.', 'success');
        await renderResourcePanel(currentServiceResources);
      } catch (err) { setBusy(btn, false); toast(err.message, 'error'); }
    };

    // =====================================================================
    // Users
    // =====================================================================
    async function renderUsers() {
      const rows = await adminFetch('/api/admin/users');
      if (!rows || rows.length === 0) { content.innerHTML = '<div class="empty">No users yet.</div>'; return; }
      content.innerHTML = tableWrap(
        '<table><thead><tr><th>Username</th><th>Admin</th><th>Created</th><th style="text-align:right">Actions</th></tr></thead><tbody>' +
        rows.map(function (u) {
          const guard = u.is_admin
            ? '<span style="color:var(--muted);font-size:.75rem">protected</span>'
            : '<button class="btn-sm danger" onclick="delUser(\'' + u.id + '\', this)">Delete</button>';
          return '<tr><td><strong>' + escapeHTML(u.username) + '</strong>' +
            ' <span style="color:var(--muted);font-size:.75rem">(' + escapeHTML(u.id.slice(0, 8)) + '…)</span></td>' +
            '<td>' + (u.is_admin ? '<span class="pill approved">admin</span>' : '<span style="color:var(--muted)">—</span>') + '</td>' +
            '<td>' + escapeHTML(new Date(u.created_at).toLocaleString()) + '</td>' +
            '<td style="text-align:right;white-space:nowrap">' + guard + '</td></tr>';
        }).join('') + '</tbody></table>'
      );
    }

    window.delUser = async function (id, btn) {
      if (!confirm('Delete this user? Their requests, grants and subscriptions are removed with them. This cannot be undone.')) return;
      setBusy(btn, true);
      try {
        await adminFetch('/api/admin/users/' + id, { method: 'DELETE' });
        toast('User deleted.', 'success');
        renderTab('users');
      } catch (err) { setBusy(btn, false); toast(err.message, 'error'); }
    };

    // =====================================================================
    // Audit Log (§22)
    // =====================================================================
    async function renderAudit() {
      const rows = await adminFetch('/api/admin/audit-log');
      if (!rows || rows.length === 0) { content.innerHTML = '<div class="empty">No audit entries yet.</div>'; return; }
      content.innerHTML = tableWrap(
        '<table><thead><tr><th>When</th><th>Actor</th><th>Type</th><th>Action</th><th>Target</th><th>IP</th></tr></thead><tbody>' +
        rows.map(function (a) {
          const target = a.target_table ? escapeHTML(a.target_table + (a.target_id ? ':' + a.target_id.slice(0, 8) : '')) : '—';
          return '<tr><td>' + escapeHTML(new Date(a.created_at).toLocaleString()) + '</td>' +
            '<td>' + (a.actor_id ? escapeHTML(a.actor_id.slice(0, 8) + '…') : '—') + '</td>' +
            '<td>' + escapeHTML(a.actor_type) + '</td>' +
            '<td><strong>' + escapeHTML(a.action) + '</strong></td>' +
            '<td>' + target + '</td>' +
            '<td>' + escapeHTML(a.ip_address || '—') + '</td></tr>';
        }).join('') + '</tbody></table>'
      );
    }

    function tableWrap(html) {
      return '<div class="table-wrap">' + html + '</div>';
    }

    // Read a named field from a form reliably. `form.title`, `form.name`,
    // `form.method` etc. are native form properties — never field values.
    function formVal(form, key) {
      const el = form.elements[key];
      return el ? el.value : '';
    }

    renderTab('overview');
  </script>
</body>
</html>
