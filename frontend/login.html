<!DOCTYPE html>
<html lang="en" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studora — Log in</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#faf7ef">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container auth-wrap">
    <div class="auth-card reveal">
      <h1 data-i18n="login.title"></h1>
      <p class="auth-sub" data-i18n="login.sub"></p>

      <button type="button" class="google-btn" id="google-btn">
        <svg class="google-g" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span data-i18n="login.google"></span>
      </button>

      <p class="auth-alt"><span data-i18n="login.noaccount"></span> <a href="./signup.html" data-i18n="nav.signup"></a></p>
      <p class="auth-alt"><a href="./" data-i18n="login.back"></a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/main.js"></script>
  <script>
    (function () {
      renderHeader();
      initScrollReveal();

      const params = new URLSearchParams(location.search);
      const next = params.get('next') || './';

      function safeRedirect(url) {
        if (url && (url.startsWith('/') && !url.startsWith('//') || url.startsWith('./') || url.startsWith('../'))) location.href = url;
        else location.href = './';
      }

      (async function () {
        // Already signed in? (e.g. returning from the Google redirect)
        const session = await getSession();
        if (session) {
          try {
            await apiFetch('/api/auth/ensure-profile', { method: 'POST', body: '{}' });
          } catch (e) { /* account probably already exists */ }
          safeRedirect(next);
          return;
        }
      })();

      const btn = document.getElementById('google-btn');
      btn.addEventListener('click', async function () {
        setBusy(btn, true);
        // Land back on the login page, which detects the new session above.
        const redirectTo = new URL('./login.html', location.href).href;
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo,
            queryParams: { access_type: 'offline', prompt: 'select_account' }
          }
        });
        if (error) {
          setBusy(btn, false);
          toast(error.message || 'Could not start Google sign-in.', 'error');
        }
        // Success: the browser navigates away to Google.
      });
    })();
  </script>
</body>
</html>
