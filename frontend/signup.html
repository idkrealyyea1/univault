<!DOCTYPE html>
<html lang="en" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniVault — Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container auth-wrap">
    <div class="auth-card reveal">
      <h1>Create your account</h1>
      <p class="auth-sub">Sign up to browse field dashboards and access paid services.</p>

      <form id="signup-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required placeholder="3-20 chars: letters, numbers, _">
        <p class="field-hint">You'll use this to log in. No email needed.</p>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="At least 8 characters">
        <p class="field-hint">Minimum 8 characters.</p>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign up</button>
      </form>

      <p class="auth-alt">Already have an account? <a href="./login.html">Log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/main.js"></script>
  <script>
    (function () {
      renderHeader();

      const params = new URLSearchParams(location.search);
      const next = params.get('next') || './';

      const form = document.getElementById('signup-form');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
          toast('Username must be 3-20 chars: letters, numbers, underscore.', 'error');
          return;
        }
        if (password.length < 8) {
          toast('Password must be at least 8 characters.', 'error');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account…';

        try {
          // Signup goes through the backend so it can be rate-limited (§7.1, §9.4)
          await apiFetch('/api/auth/signup', {
            method: 'POST',
            body: JSON.stringify({ username: username, password: password })
          });
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Sign up';
          toast(err.message, 'error');
          return;
        }

        // Now establish the session client-side with the same synthetic email
        const { error } = await supabase.auth.signInWithPassword({
          email: username + '@univault.local',
          password: password
        });

        btn.disabled = false;
        btn.textContent = 'Sign up';

        if (error) {
          toast('Account created — please log in.', 'success');
          location.href = './login.html?next=' + encodeURIComponent(next);
          return;
        }

        if (next && (next.startsWith('/') && !next.startsWith('//') || next.startsWith('./') || next.startsWith('../'))) location.href = next;
        else location.href = './';
      });
    })();
  </script>
</body>
</html>
