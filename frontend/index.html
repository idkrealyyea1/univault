<!DOCTYPE html>
<html lang="ar" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studora — اختر جامعتك</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#071410">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header id="site-header"></header>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <div class="hero-content reveal">
        <div class="hero-badge">
          <span class="hero-badge-ic">✦</span>
          <span data-i18n="hero.badge"></span>
        </div>

        <h1>
          <span data-i18n="hero.h1.1"></span><br>
          <span class="accent" data-i18n="hero.h1.2"></span>
        </h1>

        <p class="hero-sub" data-i18n="hero.sub"></p>

        <ul class="hero-benefits">
          <li class="hero-benefit"><span class="hero-benefit-ic">🎓</span><span data-i18n="hero.benefit1"></span></li>
          <li class="hero-benefit"><span class="hero-benefit-ic">💰</span><span data-i18n="hero.benefit2"></span></li>
          <li class="hero-benefit"><span class="hero-benefit-ic">⚡</span><span data-i18n="hero.benefit3"></span></li>
          <li class="hero-benefit"><span class="hero-benefit-ic">🛡️</span><span data-i18n="hero.benefit4"></span></li>
        </ul>

        <div class="hero-actions">
          <a href="#universities" class="btn btn-primary btn-lg"><span data-i18n="hero.browse"></span> <span class="btn-arrow">→</span></a>
          <a href="./apply.html" class="btn btn-ghost btn-lg" data-i18n="hero.offer"></a>
        </div>
      </div>

      <div class="hero-side reveal" style="transition-delay:120ms">
        <div class="hero-stats-card">
          <p class="stats-title">⭐ <span data-i18n="hero.stat.title"></span></p>
          <div class="stats-nums">
            <div class="stat-num">
              <b id="stat-univ">–</b>
              <span data-i18n="hero.stat.univ"></span>
            </div>
            <div class="stats-divider"></div>
            <div class="stat-num">
              <b id="stat-svc">–</b>
              <span data-i18n="hero.stat.svc"></span>
            </div>
          </div>
          <div class="stats-avatars" id="stat-avatars"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="marquee" aria-hidden="true">
    <div class="marquee-track" id="marquee-track"></div>
  </div>

  <main class="container">

    <!-- How it works -->
    <section class="how-it-works" id="how">
      <div class="section-head reveal">
        <span class="section-eyebrow" data-i18n="how.eyebrow"></span>
        <h2 data-i18n="how.title"></h2>
      </div>
      <div class="steps-grid">
        <div class="step-card reveal" style="transition-delay:0ms">
          <span class="step-num">01</span>
          <div class="step-icon">🎓</div>
          <h3 data-i18n="how.step1.title"></h3>
          <p data-i18n="how.step1.body"></p>
        </div>
        <div class="step-card reveal" style="transition-delay:120ms">
          <span class="step-num">02</span>
          <div class="step-icon">🧭</div>
          <h3 data-i18n="how.step2.title"></h3>
          <p data-i18n="how.step2.body"></p>
        </div>
        <div class="step-card reveal" style="transition-delay:240ms">
          <span class="step-num">03</span>
          <div class="step-icon">🗝️</div>
          <h3 data-i18n="how.step3.title"></h3>
          <p data-i18n="how.step3.body"></p>
        </div>
      </div>
    </section>

    <!-- Universities -->
    <section class="unis-section" id="universities">
      <div class="universities-head reveal">
        <div>
          <span class="unis-title-ic">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path d="M22 10v6"/></svg>
          </span>
          <span class="section-eyebrow" data-i18n="unis.eyebrow"></span>
          <h2 data-i18n="unis.title"></h2>
          <p data-i18n="unis.sub"></p>
        </div>
        <div class="uni-search-wrap">
          <div class="uni-search">
            <span class="search-ic">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </span>
            <input type="search" id="uni-filter" class="uni-filter" placeholder="" data-i18n-ph="unis.search" autocomplete="off" aria-label="Search universities">
          </div>
          <span class="count-pill" id="uni-count"></span>
        </div>
      </div>

      <div id="university-grid" class="university-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>

    <!-- CTA -->
    <section class="cta-band reveal">
      <div class="cta-band-inner">
        <div>
          <span class="section-eyebrow" data-i18n="cta.eyebrow"></span>
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.sub"></p>
        </div>
        <div class="cta-actions">
          <a href="./signup.html" class="btn btn-primary btn-lg" data-i18n="nav.signup"></a>
          <a href="./login.html" class="btn btn-ghost btn-lg" data-i18n="nav.login"></a>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="contact">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-mark" data-logo></span>
        <strong>Studora</strong>
        <p data-i18n="footer.tag"></p>
      </div>
      <div class="footer-links">
        <a href="#universities" data-i18n="nav.universities"></a>
        <a href="#how" data-i18n="nav.about"></a>
        <a href="./login.html" data-i18n="nav.login"></a>
        <a href="./signup.html" data-i18n="nav.signup"></a>
      </div>
    </div>
    <div class="container footer-bottom" data-i18n="footer.copyright"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/main.js"></script>
  <script>
    (async function () {
      await renderHeader();
      initScrollReveal();

      const grid = document.getElementById('university-grid');

      async function load() {
        const { data, error } = await supabase
          .from('universities')
          .select('*')
          .order('name');

        if (error) {
          grid.innerHTML = '<div class="error-panel">Could not load universities: ' + escapeHTML(error.message) + '</div>';
          return;
        }
        if (!data || data.length === 0) {
          grid.innerHTML = '<div class="error-panel">No universities found yet.</div>';
          return;
        }

        document.getElementById('uni-count').textContent = data.length + ' ' + t('unis.count');
        buildMarquee(data);

        // Count fields & services per university (real data, cosmetic)
        let fieldsCount = {};
        let servCount = {};
        let svcTotal = 0;
        try {
          const [{ data: fRows }, { data: sRows }] = await Promise.all([
            supabase.from('fields').select('id, university_id'),
            supabase.from('services').select('id, field_id')
          ]);
          const uniOfField = {};
          (fRows || []).forEach(function (x) { uniOfField[x.id] = x.university_id; });
          (fRows || []).forEach(function (x) { fieldsCount[x.university_id] = (fieldsCount[x.university_id] || 0) + 1; });
          (sRows || []).forEach(function (x) {
            const uid = uniOfField[x.field_id];
            if (uid) servCount[uid] = (servCount[uid] || 0) + 1;
            svcTotal++;
          });
        } catch (e) { /* counts are optional */ }

        // Live stats card (real numbers)
        document.getElementById('stat-univ').textContent = data.length + '+';
        document.getElementById('stat-svc').textContent = svcTotal + '+';
        const avatars = document.getElementById('stat-avatars');
        const initials = data.slice(0, 4).map(function (u) {
          return (u.name.match(/\b\w/g) || ['U']).slice(0, 2).join('');
        });
        avatars.innerHTML = initials.map(function (ini) {
          return '<span class="avatar">' + escapeHTML(ini) + '</span>';
        }).join('') + '<span class="avatar plus">+</span>';

        grid.innerHTML = data.map(function (u, i) {
          const initialsFull = (u.name.match(/\b\w/g) || ['U']).slice(0, 3).join('');
          const grad = 'grad-' + (i % 6);
          const fc = fieldsCount[u.id] || 0;
          const sc = servCount[u.id] || 0;
          const abbr = (u.name.match(/\b\w/g) || ['U']).slice(0, 3).join('').toUpperCase();
          const photo = uniImage(u.slug);
          return '<a class="university-card ' + grad + ' reveal" href="./university.html?u=' + encodeURIComponent(u.slug) + '" style="transition-delay:' + (i * 60) + 'ms" data-search="' + escapeHTML((u.name + ' ' + (u.type || '') + ' ' + (u.description || '')).toLowerCase()) + '">' +
            '  <div class="uni-banner ' + grad + '">' +
            (photo ? '    <img class="uni-photo" src="' + photo + '" alt="' + escapeHTML(u.name) + '" loading="lazy" onerror="this.remove()">' : '') +
            '    <span class="uni-num">' + String(i + 1).padStart(2, '0') + '</span>' +
            '    <div class="uni-logo">' + escapeHTML(initialsFull) + '</div>' +
            '  </div>' +
            '  <div class="uni-card-body">' +
            '    <div class="uni-card-top">' +
            '      <h3>' + escapeHTML(u.name) + '</h3>' +
            '      <span class="uni-abbr">' + escapeHTML(abbr) + '</span>' +
            '    </div>' +
            '    <span class="uni-type-pill">' + escapeHTML(u.type) + '</span>' +
            '    <p class="uni-desc">' + escapeHTML(u.description || '') + '</p>' +
            '    <div class="uni-stats">' +
            '      <span>👥 <b>' + fc + '</b> <span data-i18n="uni.stat.fields"></span></span>' +
            '      <span class="stat-divider"></span>' +
            '      <span>📦 <b>' + sc + '</b> <span data-i18n="uni.stat.services"></span></span>' +
            '    </div>' +
            '    <div class="uni-cta"><span data-i18n="uni.fields"></span><span class="uni-arrow"><span class="arrow-glyph">→</span></span></div>' +
            '  </div>' +
            '</a>';
        }).join('');

        // Live filter by name/type/description
        const filter = document.getElementById('uni-filter');
        if (filter) {
          filter.addEventListener('input', function () {
            const q = filter.value.trim().toLowerCase();
            let shown = 0;
            grid.querySelectorAll('.university-card').forEach(function (card) {
              const hit = !q || (card.dataset.search || '').indexOf(q) !== -1;
              card.style.display = hit ? '' : 'none';
              if (hit) shown++;
            });
            let empty = grid.querySelector('.filter-empty');
            if (shown === 0 && !empty) {
              empty = document.createElement('div');
              empty.className = 'filter-empty';
              empty.textContent = t('unis.nomatch', { q: filter.value.trim() });
              grid.appendChild(empty);
            } else if (empty) {
              empty.remove();
            }
            const count = document.getElementById('uni-count');
            if (count) count.textContent = q ? shown + ' / ' + data.length + ' ' + t('unis.count') : data.length + ' ' + t('unis.count');
          });
        }

        applyTranslations();
        initScrollReveal();
      }

      function buildMarquee(unis) {
        const names = unis.map(function (u) { return u.name; });
        const half = names.concat(names, names);
        const track = document.getElementById('marquee-track');
        track.innerHTML = half.map(function (n) {
          return '<span class="marquee-item">' + escapeHTML(n) + '<span class="marquee-star">✦</span></span>';
        }).join('');
      }

      load();
    })();
  </script>
</body>
</html>
