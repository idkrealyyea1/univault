<!DOCTYPE html>
<html lang="en" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studora — Dashboard</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#faf7ef">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="preconnect" href="https://univault-backend-lss1.onrender.com" crossorigin>
</head>
<body>
  <header id="site-header"></header>

  <main class="container dashboard-container">
    <div class="back-link reveal"><a href="#" id="back-to-fields">← <span data-i18n="field.back"></span></a></div>

    <div class="dashboard-head reveal">
      <div>
        <p class="dashboard-kicker" id="dashboard-uni"></p>
        <h1 id="dashboard-title">Loading…</h1>
        <p id="dashboard-desc"></p>
      </div>
      <button class="btn btn-ghost" id="push-btn" hidden data-i18n="field.notify"></button>
    </div>

    <section id="featured-section" hidden>
      <div class="section-head reveal featured-head">
        <div>
          <span class="section-eyebrow" data-i18n="field.mostbought"></span>
          <h2 data-i18n="field.mostbought"></h2>
          <p data-i18n="field.mostbought.sub"></p>
        </div>
      </div>
      <div id="featured-grid" class="featured-grid"></div>
    </section>

    <div class="section-head reveal">
      <h2 data-i18n="field.avail"></h2>
      <p data-i18n="field.avail.sub"></p>
    </div>

    <div id="services-grid" class="services-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </main>

  <!-- Payment instructions modal -->
  <div class="modal" id="payment-modal">
    <div class="modal-box">
      <button class="modal-close">×</button>
      <h3 id="pay-modal-title" data-i18n="field.req.title"></h3>
      <p id="pay-modal-desc" data-i18n="field.req.desc"></p>
      <div class="pay-details" id="pay-details"></div>
      <p class="pay-note" data-i18n="field.req.paynote"></p>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="hideModal('payment-modal')" data-i18n="field.gotit"></button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>Studora — a community academic resource platform.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/push.js"></script>
  <script>
    (async function () {
      bindModalClose();
      initScrollReveal();

      const params = new URLSearchParams(location.search);
      const uniSlug = params.get('u');
      const fieldSlug = params.get('f');

      if (!uniSlug || !fieldSlug) { location.href = './'; return; }

      // ---- Auth gate first (§5) — never show content to guests ----
      const session = await requireAuth('./field.html?u=' + encodeURIComponent(uniSlug) + '&f=' + encodeURIComponent(fieldSlug));
      if (!session) return;

      // ---- Load field + university (public) ----
      const { data: uni } = await supabase.from('universities').select('*').eq('slug', uniSlug).maybeSingle();
      if (!uni) { toast(t('toast.uni.notfound'), 'error'); location.href = './'; return; }

      const { data: field } = await supabase
        .from('fields')
        .select('*')
        .eq('university_id', uni.id)
        .eq('slug', fieldSlug)
        .maybeSingle();
      if (!field) { toast(t('toast.field.notfound'), 'error'); location.href = './university.html?u=' + encodeURIComponent(uniSlug); return; }

      document.getElementById('back-to-fields').href = './university.html?u=' + encodeURIComponent(uniSlug);
      document.getElementById('dashboard-uni').textContent = uni.name;
      document.getElementById('dashboard-title').textContent = field.name;
      document.getElementById('dashboard-desc').textContent = field.description || '';

      // ---- Special theme (§11): UCAS → Cybersecurity ----
      if (uniSlug === 'ucas' && field.theme === 'cyber') {
        document.documentElement.classList.remove('theme-default');
        document.documentElement.classList.add('theme-cyber');
        document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="./css/cyber-theme.css">');
        const script = document.createElement('script');
        script.src = './js/cyber-theme.js';
        document.body.appendChild(script);
      }

      await renderHeader();

      const pushBtn = document.getElementById('push-btn');
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        pushBtn.hidden = false;
        pushBtn.addEventListener('click', function () { subscribeToPush(); });
      }

      const grid = document.getElementById('services-grid');
      const featuredSection = document.getElementById('featured-section');
      const featuredGrid = document.getElementById('featured-grid');

      async function load() {
        const { data: services, error: sErr } = await supabase
          .from('services')
          .select('id, field_id, owner_id, title, description, price, is_active, is_featured')
          .eq('field_id', field.id)
          .eq('is_active', true)
          .order('created_at');

        if (sErr) { grid.innerHTML = '<div class="error-panel">' + t('field.loaderr') + '</div>'; return; }

        if (!services || services.length === 0) {
          featuredSection.hidden = true;
          grid.innerHTML = '<div class="error-panel">' + t('field.none') + '</div>';
          return;
        }

        const { data: popularity } = await supabase
          .from('service_popularity')
          .select('service_id, purchase_count');

        const popMap = {};
        (popularity || []).forEach(function (p) { popMap[p.service_id] = p.purchase_count || 0; });

        const featured = services.filter(function (s) { return !!s.is_featured; });
        const rest = services.filter(function (s) { return !s.is_featured; });

        rest.sort(function (a, b) {
          return (popMap[b.id] || 0) - (popMap[a.id] || 0);
        });

        const topIds = new Set(rest.slice(0, 3).map(function (s) { return s.id; }));

        const { data: grants } = await supabase.from('access_grants').select('service_id').eq('user_id', session.user.id);
        const granted = new Set((grants || []).map(function (g) { return g.service_id; }));

        const { data: requests } = await supabase.from('access_requests').select('service_id, status').eq('user_id', session.user.id);
        const reqMap = {};
        (requests || []).forEach(function (r) { reqMap[r.service_id] = r.status; });

        const ownerIds = services.filter(function (s) { return s.owner_id; }).map(function (s) { return s.owner_id; });
        let ownerNames = {};
        if (ownerIds.length) {
          const { data: owners } = await supabase.from('profiles').select('id, username').in('id', ownerIds);
          (owners || []).forEach(function (o) { ownerNames[o.id] = o.username; });
        }

        const cyber = document.documentElement.classList.contains('theme-cyber');

        function serviceCard(s, i, isFeatured) {
          const isGranted = granted.has(s.id);
          const reqStatus = reqMap[s.id] || null;
          const price = formatPrice(s.price);
          const owner = s.owner_id ? ('<p class="service-owner">' + t('field.offeredby') + ' <strong>' + escapeHTML(ownerNames[s.owner_id] || t('field.member')) + '</strong></p>') : '';

          let badge = '';
          if (isFeatured) {
            badge = '<span class="popular-badge">★ ' + t('field.mostbought.badge') + '</span>';
          } else if (topIds.has(s.id)) {
            badge = cyber
              ? '<span class="popular-badge cyber-popular">' + t('field.highdemand') + '</span>'
              : '<span class="popular-badge">' + t('field.mostbought.badge') + '</span>';
          }

          let action = '';
          let stateClass = 'locked';
          if (isGranted) {
            stateClass = 'unlocked';
            action = '<button class="btn btn-primary" data-action="open" data-id="' + s.id + '">' + t('field.open') + '</button>';
          } else if (reqStatus === 'pending') {
            stateClass = 'pending';
            action = '<button class="btn btn-disabled" disabled>' + t('field.pending') + '</button>';
          } else if (reqStatus === 'rejected') {
            stateClass = 'locked';
            action = '<button class="btn btn-primary" data-action="request" data-id="' + s.id + '">' + t('field.requestagain') + '</button>';
          } else {
            stateClass = 'locked';
            action = '<button class="btn btn-primary" data-action="request" data-id="' + s.id + '">' + t('field.request') + '</button>';
          }

          return '<div class="service-card reveal ' + stateClass + (isFeatured ? ' featured-card' : '') + '" style="transition-delay:' + (i * 50) + 'ms" data-id="' + s.id + '">' +
            '  ' + badge +
            '  <div class="service-card-head">' +
            '    <h3>' + escapeHTML(s.title) + '</h3>' +
            '    <span class="service-price">' + escapeHTML(price) + '</span>' +
            '  </div>' +
            '  <p class="service-desc">' + escapeHTML(s.description || '') + '</p>' +
            owner +
            '  <div class="service-card-foot">' +
            '    <span class="lock-indicator" data-state="' + stateClass + '">' +
            (stateClass === 'unlocked' ? t('field.unlocked') : stateClass === 'pending' ? t('field.pendingstate') : t('field.locked')) +
            '    </span>' +
            action +
            '  </div>' +
            '</div>';
        }

        if (featured.length) {
          featuredSection.hidden = false;
          featuredGrid.innerHTML = featured.map(function (s, i) {
            return serviceCard(s, i, true);
          }).join('');
        } else {
          featuredSection.hidden = true;
        }

        if (rest.length === 0) {
          grid.innerHTML = '<div class="error-panel">' + t('field.none') + '</div>';
        } else {
          grid.innerHTML = rest.map(function (s, i) {
            return serviceCard(s, i, false);
          }).join('');
        }

        applyTranslations();
        initScrollReveal();

        function wire(container) {
          container.querySelectorAll('button[data-action]').forEach(function (btn) {
            btn.addEventListener('click', async function () {
              const sid = btn.dataset.id;
              const svc = services.find(function (x) { return x.id === sid; });
              if (!svc) return;
              if (btn.dataset.action === 'request') await requestAccess(svc);
              else if (btn.dataset.action === 'open') location.href = './service.html?s=' + encodeURIComponent(svc.id);
            });
          });
        }
        wire(featuredGrid);
        wire(grid);
      }

      async function requestAccess(service) {
        btnBusy('.dashboard-container');
        try {
          const res = await apiFetch('/api/access-requests', {
            method: 'POST',
            body: JSON.stringify({ service_id: service.id })
          });
          const prof = await getProfile();
          const username = prof && prof.username ? prof.username : t('field.pay.you');
          if (res.existing === 'pending' || res.ok) {
            document.getElementById('pay-modal-title').textContent = t('field.request.sent');
            document.getElementById('pay-details').innerHTML =
              '<div class="pay-step"><strong>1.</strong> ' + t('field.pay.step1') + ' <b>' + escapeHTML(formatPrice(service.price)) + '</b> ' + t('field.pay.step1b') + ' <b>' + escapeHTML(service.title) + '</b> ' + t('field.pay.step1c') + '</div>' +
              '<div class="pay-step"><strong>2.</strong> ' + t('field.pay.step2') + ' (<b>' + escapeHTML(username) + '</b>) ' + t('field.pay.step2b') + '</div>' +
              '<div class="pay-step"><strong>3.</strong> ' + t('field.pay.step3') + '</div>';
          } else {
            document.getElementById('pay-modal-title').textContent = t('field.request.existing');
          }
          showModal('payment-modal');
          await load();
        } catch (err) {
          toast(err.message, 'error');
        } finally {
          btnBusy('.dashboard-container', false);
        }
      }

      function btnBusy(scope, on) {
        document.querySelectorAll(scope + ' button').forEach(function (b) {
          b.disabled = !!on;
        });
      }

      load();
    })();
  </script>
</body>
</html>
