<!DOCTYPE html>
<html lang="en" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studora — Gallery</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#faf7ef">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container gallery">
    <div class="section-head reveal">
      <span class="section-eyebrow" data-i18n="gallery.eyebrow"></span>
      <h1 data-i18n="gallery.title"></h1>
      <p data-i18n="gallery.sub"></p>
    </div>

    <section class="gallery-section reveal">
      <h2 data-i18n="gallery.desktop"></h2>
      <div class="gallery-grid">
        <figure class="gallery-item"><img src="./img/gallery/desktop-1.webp" alt="Desktop background 1" loading="lazy"><figcaption>01</figcaption></figure>
        <figure class="gallery-item"><img src="./img/gallery/desktop-2.webp" alt="Desktop background 2" loading="lazy"><figcaption>02</figcaption></figure>
        <figure class="gallery-item"><img src="./img/gallery/desktop-3.webp" alt="Desktop background 3" loading="lazy"><figcaption>03</figcaption></figure>
        <figure class="gallery-item"><img src="./img/gallery/desktop-4.webp" alt="Desktop background 4" loading="lazy"><figcaption>04</figcaption></figure>
        <figure class="gallery-item"><img src="./img/gallery/desktop-5.webp" alt="Desktop background 5" loading="lazy"><figcaption>05</figcaption></figure>
      </div>
    </section>

    <section class="gallery-section reveal">
      <h2 data-i18n="gallery.mobile"></h2>
      <div class="gallery-grid mobile">
        <figure class="gallery-item"><img src="./img/gallery/mobile-1.webp" alt="Mobile background 1" loading="lazy"><figcaption>01</figcaption></figure>
        <figure class="gallery-item"><img src="./img/gallery/mobile-2.webp" alt="Mobile background 2" loading="lazy"><figcaption>02</figcaption></figure>
        <figure class="gallery-item"><img src="./img/gallery/mobile-3.webp" alt="Mobile background 3" loading="lazy"><figcaption>03</figcaption></figure>
        <figure class="gallery-item"><img src="./img/gallery/mobile-4.webp" alt="Mobile background 4" loading="lazy"><figcaption>04</figcaption></figure>
      </div>
    </section>
  </main>

  <footer class="site-footer landing-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-mark">S</span>
        <strong>Studora</strong>
        <p data-i18n="footer.tag"></p>
      </div>
      <div class="footer-links">
        <a href="./" data-i18n="nav.universities"></a>
        <a href="./login.html" data-i18n="nav.login"></a>
        <a href="./signup.html" data-i18n="nav.signup"></a>
      </div>
    </div>
    <div class="container footer-bottom" data-i18n="footer.copyright"></div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Image preview" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/main.js"></script>
  <script>
    (function () {
      applyTranslations();
      renderHeader();
      initScrollReveal();

      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      function openLightbox(src) {
        lightboxImg.src = src;
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        lightbox.hidden = true;
        lightboxImg.src = '';
        document.body.style.overflow = '';
      }
      document.querySelectorAll('.gallery-item').forEach(function (item) {
        item.addEventListener('click', function () {
          openLightbox(item.querySelector('img').src);
        });
        item.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(item.querySelector('img').src); }
        });
        item.setAttribute('tabindex', '0');
        item.setAttribute('role', 'button');
      });
      lightbox.addEventListener('click', closeLightbox);
      document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !lightbox.hidden) closeLightbox();
      });
    })();
  </script>
</body>
</html>
