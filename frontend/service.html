<!DOCTYPE html>
<html lang="en" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studora — Service</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#faf7ef">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="preconnect" href="https://univault-backend-lss1.onrender.com" crossorigin>
</head>
<body>
  <header id="site-header"></header>

  <main class="container dashboard-container">
    <div class="back-link reveal">
      <a href="#" id="svc-back"><span data-i18n="svc.back"></span></a>
    </div>

    <section class="service-hero reveal" id="svc-hero">
      <div class="svc-orb svc-orb-a"></div>
      <div class="svc-orb svc-orb-b"></div>
      <div class="svc-orb svc-orb-c"></div>
      <div class="service-hero-inner">
        <p class="svc-kicker" id="svc-breadcrumb">…</p>
        <h1 id="svc-title">Loading…</h1>
        <p class="svc-desc" id="svc-desc"></p>
        <div class="svc-meta">
          <span class="svc-price-chip" id="svc-price"></span>
          <span class="svc-owner" id="svc-owner"></span>
          <span class="svc-featured" id="svc-featured" hidden>★ <span data-i18n="field.mostbought.badge"></span></span>
        </div>
      </div>
      <div class="svc-status-ribbon" id="svc-ribbon"></div>
    </section>

    <div id="svc-state" class="reveal">
      <div class="skeleton-card"></div>
    </div>
  </main>

  <!-- Payment instructions modal -->
  <div class="modal" id="payment-modal">
    <div class="modal-box">
      <button class="modal-close">×</button>
      <h3 id="pay-modal-title" data-i18n="field.req.title"></h3>
      <p id="pay-modal-desc" data-i18n="field.req.desc"></p>
      <div class="pay-details" id="pay-details"></div>
      <p class="pay-note" data-i18n="field.req.paynote"></p>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="hideModal('payment-modal')" data-i18n="field.gotit"></button>
      </div>
    </div>
  </div>

  <!-- Access request form modal -->
  <div class="modal" id="request-form-modal">
    <div class="modal-box">
      <button class="modal-close">×</button>
      <h3 data-i18n="reqform.title"></h3>
      <p data-i18n="reqform.sub"></p>
      <form id="request-form" class="form-grid" autocomplete="on" novalidate>
        <label for="rf-name" data-i18n="reqform.name"></label>
        <input id="rf-name" name="requester_name" required maxlength="100" data-i18n-ph="reqform.name.ph">
        <label for="rf-whatsapp" data-i18n="reqform.whatsapp"></label>
        <input id="rf-whatsapp" name="whatsapp" type="tel" required minlength="7" maxlength="30" data-i18n-ph="reqform.whatsapp.ph">
        <label for="rf-email" data-i18n="reqform.email"></label>
        <input id="rf-email" name="email" type="email" readonly required>
        <button type="submit" class="btn btn-primary full" data-i18n="reqform.submit"></button>
      </form>
      <p class="pay-note" data-i18n="reqform.note"></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>Studora — a community academic resource platform.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/push.js"></script>
  <script>
    (function () {
      'use strict';

      // This page is private: no session → redirect to login (with a
      // return link so the user comes straight back after logging in).
      requireAuth().then(async function (session) {
        if (!session) return;

        await renderHeader();
        initScrollReveal();

        const params = new URLSearchParams(location.search);
        const serviceId = params.get('s');
        if (!serviceId) { location.href = './'; return; }

        const state = document.getElementById('svc-state');
        const title = document.getElementById('svc-title');

        let view;
        try {
          view = await apiFetch('/api/services/' + encodeURIComponent(serviceId) + '/view');
        } catch (err) {
          state.innerHTML = '<div class="error-panel">' + t('svc.notfound') + '</div>';
          title.textContent = '—';
          document.title = 'Studora — Service';
          applyTranslations();
          return;
        }

        document.title = view.service.title + ' — Studora';
        title.textContent = view.service.title;
        document.getElementById('svc-desc').textContent = view.service.description || '';
        document.getElementById('svc-price').textContent = formatPrice(view.service.price);

        if (view.owner && view.owner.username) {
          document.getElementById('svc-owner').textContent = t('field.offeredby') + ' ' + view.owner.username;
        }
        if (view.service.is_featured) {
          document.getElementById('svc-featured').hidden = false;
        }
        // Provider (service owner) sees their own service with the buyer
        // chat; nobody can start a chat with themselves.
        const isOwner = !!view.service.owner_id && session.user.id === view.service.owner_id;
        setRibbon(isOwner ? 'owner' : (view.granted ? 'granted' : view.status));

        if (view.university && view.field) {
          const back = document.getElementById('svc-back');
          back.href = './field.html?u=' + encodeURIComponent(view.university.slug) + '&f=' + encodeURIComponent(view.field.slug);
          back.querySelector('span').textContent = '← ' + view.university.name + ' / ' + view.field.name;
          back.querySelector('span').removeAttribute('data-i18n');
          document.getElementById('svc-breadcrumb').textContent = view.university.name + ' · ' + view.field.name;
        } else {
          const back = document.getElementById('svc-back');
          back.href = './';
          back.querySelector('span').textContent = '← ' + t('svc.back');
          back.querySelector('span').removeAttribute('data-i18n');
        }

        if (view.granted || isOwner) {
          await renderGranted(view.service, isOwner);
        } else if (view.status === 'pending') {
          state.innerHTML =
            '<div class="state-panel pending">' +
            '  <span class="lock-indicator" data-state="pending">' + t('field.pendingstate') + '</span>' +
            '  <p>' + t('svc.pending.sub') + '</p>' +
            '  <div class="state-actions"><button class="btn btn-primary" onclick="location.reload()">' + t('field.gotit') + '</button></div>' +
            '</div>';
        } else if (view.status === 'rejected') {
          state.innerHTML =
            '<div class="state-panel locked">' +
            '  <span class="lock-indicator" data-state="locked">' + t('svc.rejected.title') + '</span>' +
            '  <p>' + t('svc.rejected.sub') + '</p>' +
            '  <div class="state-actions">' +
            '    <button class="btn btn-primary" data-request>🔁 ' + t('field.requestagain') + '</button>' +
            '  </div>' +
            '</div>';
          wireRequest();
        } else {
          state.innerHTML =
            '<div class="state-panel locked">' +
            '  <span class="lock-indicator" data-state="locked">' + t('svc.locked.title') + '</span>' +
            '  <p>' + t('svc.locked.sub') + '</p>' +
            '  <div class="state-actions">' +
            '    <button class="btn btn-primary" data-request>🔒 ' + t('field.request') + '</button>' +
            '  </div>' +
            '</div>';
          wireRequest();
        }

        applyTranslations();

        function wireRequest() {
          const btn = state.querySelector('[data-request]');
          if (!btn) return;
          btn.addEventListener('click', function () {
            document.getElementById('rf-email').value = (session && session.user && session.user.email) || '';
            const form = document.getElementById('request-form');
            form.reset();
            document.getElementById('rf-email').value = (session && session.user && session.user.email) || '';
            showModal('request-form-modal');
          });
        }

        document.getElementById('request-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          const form = e.target;
          const data = {
            service_id: serviceId,
            requester_name: form.elements['requester_name'].value.trim(),
            whatsapp: form.elements['whatsapp'].value.trim(),
            email: form.elements['email'].value.trim()
          };
          if (!data.requester_name) { toast(t('reqform.errname'), 'error'); return; }
          if (!/^\+?[0-9\s\-()]{7,30}$/.test(data.whatsapp)) { toast(t('reqform.errwhatsapp'), 'error'); return; }
          const btn = form.querySelector('button[type=submit]');
          setBusy(btn, true);
          try {
            const res = await apiFetch('/api/access-requests', {
              method: 'POST',
              body: JSON.stringify(data)
            });
            const prof = await getProfile();
            const username = prof && prof.username ? prof.username : t('field.pay.you');
            hideModal('request-form-modal');
            if (res.existing === 'pending' || res.ok) {
              document.getElementById('pay-modal-title').textContent = t('field.request.sent');
              document.getElementById('pay-details').innerHTML =
                '<div class="pay-step"><strong>1.</strong> ' + t('field.pay.step1') + ' <b>' + escapeHTML(formatPrice(view.service.price)) + '</b> ' + t('field.pay.step1b') + ' <b>' + escapeHTML(view.service.title) + '</b> ' + t('field.pay.step1c') + '</div>' +
                '<div class="pay-step"><strong>2.</strong> ' + t('field.pay.step2') + ' (<b>' + escapeHTML(username) + '</b>) ' + t('field.pay.step2b') + '</div>' +
                '<div class="pay-step"><strong>3.</strong> ' + t('field.pay.step3') + '</div>';
            } else {
              document.getElementById('pay-modal-title').textContent = t('field.request.existing');
            }
            showModal('payment-modal');
            await load();
          } catch (err) {
            toast(err.message, 'error');
          } finally {
            setBusy(btn, false);
          }
        });

        async function renderGranted(service, isOwner) {
          let html =
            '<div class="state-panel granted">' +
            '  <span class="lock-indicator" data-state="unlocked">' + (isOwner ? t('svc.owner.badge') : t('svc.unlocked.badge')) + '</span>' +
            '  <p>' + (isOwner ? t('svc.owner.sub') : t('svc.unlocked.sub')) + '</p>' +
            '</div>' +
            '<div class="vault-grid">' +
            '  <div class="vault-files">' +
            '    <div class="section-head res-head">' +
            '      <span class="section-eyebrow" data-i18n="svc.files.title"></span>' +
            '      <h2 data-i18n="svc.files.title"></h2>' +
            '      <p class="res-hint">' + t('field.files.hint') + '</p>' +
            '    </div>' +
            '    <div id="res-list" class="res-list"><div class="skeleton-card"></div></div>' +
            '  </div>' +
            '  <aside class="vault-aside">' +
            '    <div class="panel about-panel">' +
            '      <div class="panel-head"><div class="p-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></div><div><h3>' + t('svc.about') + '</h3></div></div>' +
            '      <p>' + (service.description ? escapeHTML(service.description) : t('svc.about.none')) + '</p>' +
            '    </div>' +
            '  </aside>' +
            '</div>' +
            '<section class="chat-section" id="chat-section">' +
            '  <div class="section-head">' +
            '    <span class="section-eyebrow" data-i18n="chat.eyebrow"></span>' +
            '    <h2 data-i18n="' + (isOwner ? 'chat.title.provider' : 'chat.title') + '"></h2>' +
            '  </div>' +
            '  <div class="chat-card">' +
            '    <div class="chat-card-head">' +
            '      <span class="chat-avatar" id="chat-avatar"></span>' +
            '      <div class="chat-card-head-info">' +
            '        <strong id="chat-partner"></strong>' +
            '        <span id="chat-subtitle"></span>' +
            '      </div>' +
            '    </div>' +
            '    <div class="chat-messages" id="chat-messages"></div>' +
            '    <div class="chat-composer" id="chat-composer">' +
            '      <textarea id="chat-input" rows="1" maxlength="2000" placeholder="' + escapeHTML(t('chat.placeholder')) + '"></textarea>' +
            '      <button type="button" class="btn btn-primary" id="chat-send">' + t('chat.send') + '</button>' +
            '    </div>' +
            '  </div>' +
            '</section>';
          state.innerHTML = html;
          applyTranslations();

          if (isOwner) {
            // Providers manage files from the admin dashboard — the grant
            // gate below is for buyers only, so skip the fetch entirely.
            document.getElementById('res-list').innerHTML = '<div class="res-empty">' + t('svc.owner.files') + '</div>';
            initChat();
            return;
          }

          let resources;
          try {
            resources = await apiFetch('/api/resources/' + encodeURIComponent(service.id));
          } catch (err) {
            document.getElementById('res-list').innerHTML = '<p class="error-panel">' + escapeHTML(err.message) + '</p>';
            return;
          }

          const list = document.getElementById('res-list');
          if (!resources || resources.length === 0) {
            list.innerHTML = '<div class="res-empty">' + t('field.nofiles') + '</div>';
          } else {
            list.innerHTML = resources.map(function (r) {
              const href = r.signed_url || r.external_link;
              const icon = fileIcon(r);
              if (!href) {
                return '<div class="res-item"><span class="res-icon">' + icon + '</span><div><strong>' + escapeHTML(r.title) + '</strong></div><span class="res-meta">' + t('field.nolink') + '</span></div>';
              }
              // Defense in depth: only render http(s) URLs as links. The
              // backend already rejects other schemes; this guards against
              // any legacy/malformed rows ever reaching the DOM.
              const safeHref = (href && /^https?:\/\//i.test(href)) ? href : null;
              return '<div class="res-item">' +
                '  <span class="res-icon">' + icon + '</span>' +
                '  <div><strong>' + escapeHTML(r.title) + '</strong>' +
                '  <span class="res-meta">' + escapeHTML(r.file_type || (r.external_link ? 'external' : 'file')) + ' · ' + t('field.files.hint') + '</span></div>' +
                (safeHref
                  ? '<a class="btn btn-primary" href="' + escapeHTML(safeHref) + '" target="_blank" rel="noopener">' + t('field.download') + '</a>'
                  : '<span class="res-meta">' + t('field.nolink') + '</span>') +
                '</div>';
            }).join('');
          }
          initChat();
        }

        function setRibbon(status) {
          const ribbon = document.getElementById('svc-ribbon');
          if (!ribbon) return;
          const map = {
            granted: { cls: 'granted', label: t('svc.unlocked.badge') },
            owner: { cls: 'granted', label: t('svc.owner.badge') },
            pending: { cls: 'pending', label: t('field.pendingstate') },
            rejected: { cls: 'rejected', label: t('svc.rejected.title') },
            none: { cls: 'locked', label: t('field.locked') }
          };
          const s = map[status] || map.none;
          ribbon.className = 'svc-status-ribbon ' + s.cls;
          ribbon.textContent = s.label;
        }

        function fileIcon(r) {
          const ft = String(r.file_type || '').toLowerCase();
          if (r.external_link) return '🔗';
          if (ft.indexOf('pdf') !== -1) return '📄';
          if (ft.indexOf('zip') !== -1 || ft.indexOf('rar') !== -1 || ft.indexOf('archive') !== -1) return '📦';
          if (ft.indexOf('doc') !== -1) return '📝';
          if (ft.indexOf('xls') !== -1 || ft.indexOf('sheet') !== -1) return '📊';
          if (ft.indexOf('ppt') !== -1 || ft.indexOf('slide') !== -1) return '📽️';
          if (ft.indexOf('image') !== -1) return '🖼️';
          return '📁';
        }

        async function load() {
          try {
            view = await apiFetch('/api/services/' + encodeURIComponent(serviceId) + '/view');
            const isOwner = !!view.service.owner_id && session.user.id === view.service.owner_id;
            setRibbon(isOwner ? 'owner' : (view.granted ? 'granted' : view.status));
            if (view.granted || isOwner) { await renderGranted(view.service, isOwner); return; }
            if (view.status === 'pending') {
              state.innerHTML =
                '<div class="state-panel pending">' +
                '  <span class="lock-indicator" data-state="pending">' + t('field.pendingstate') + '</span>' +
                '  <p>' + t('svc.pending.sub') + '</p>' +
                '</div>';
            } else {
              state.innerHTML =
                '<div class="state-panel locked">' +
                '  <span class="lock-indicator" data-state="locked">' + t('svc.locked.title') + '</span>' +
                '  <p>' + t('svc.locked.sub') + '</p>' +
                '</div>';
            }
            applyTranslations();
          } catch (err) {
            toast(err.message, 'error');
          }
        }

        // =================================================================
        // Chat — buyer <-> provider. Renders inside the service page.
        // Security is enforced server-side (sender identity, participant
        // membership, 24h expiry); the UI only reflects what the API says.
        // =================================================================
        const chat = {
          role: null,          // 'buyer' | 'provider'
          conversation: null,  // { id, expires_at, expired }
          providerName: null,
          providerConvs: null, // provider: conversation list data
          channel: null,       // supabase realtime channel
          messageIds: new Set(),
          oldestAt: null,
          hasMore: true,
          loadingOlder: false,
          sending: false,
          readTimer: null,
          atBottom: true
        };

        async function initChat() {
          const el = document.getElementById('chat-messages');
          let res;
          try {
            res = await apiFetch('/api/chat/' + encodeURIComponent(serviceId));
          } catch (err) {
            el.innerHTML = '<div class="chat-empty">' + escapeHTML(err.message) + '</div>';
            const composer = document.getElementById('chat-composer');
            if (composer) composer.style.display = 'none';
            return;
          }

          chat.role = res.role;
          if (res.role === 'provider') {
            document.getElementById('chat-avatar').textContent = '👥';
            document.getElementById('chat-partner').textContent = t('chat.provider.you');
            chat.providerConvs = {};
            (res.conversations || []).forEach(function (c) { chat.providerConvs[c.id] = c; });
            renderConversationList(res.conversations || []);
            return;
          }

          // buyer
          chat.providerName = res.provider || '';
          document.getElementById('chat-avatar').textContent = (chat.providerName || '?').charAt(0).toUpperCase();
          document.getElementById('chat-partner').textContent = chat.providerName;
          if (!res.conversation) {
            chat.conversation = null;
            el.innerHTML = '<div class="chat-empty">' + t('chat.empty') + '</div>';
            return;
          }
          chat.conversation = res.conversation;
          document.getElementById('chat-subtitle').textContent = chatFormatExpiry(res.conversation.expires_at);
          if (res.conversation.expired) { renderChatExpired(); return; }
          renderMessages(res.messages || []);
          subscribeRealtime(res.conversation.id);
          markRead(res.conversation.id);
        }

        function renderConversationList(conversations) {
          const el = document.getElementById('chat-messages');
          if (!conversations.length) {
            el.innerHTML = '<div class="chat-empty">' + t('chat.empty.provider') + '</div>';
            return;
          }
          el.innerHTML = '<div class="chat-conv-list">' + conversations.map(function (c) {
            const preview = c.last_message
              ? escapeHTML(c.last_message.slice(0, 80))
              : (c.expired ? escapeHTML(t('chat.expired.title')) : escapeHTML(t('chat.conv.empty')));
            return '<button type="button" class="chat-conv-item" data-conv="' + escapeHTML(c.id) + '">' +
              '<span class="chat-avatar">' + escapeHTML((c.buyer || '?').charAt(0).toUpperCase()) + '</span>' +
              '<span class="chat-conv-main"><strong>' + escapeHTML(c.buyer) + '</strong>' +
              '<span class="chat-conv-last">' + preview + '</span></span>' +
              '<span class="chat-conv-meta">' +
              (c.unread ? '<span class="chat-unread">' + Math.min(c.unread, 99) + '</span>' : '') +
              '<span class="chat-conv-time">' + escapeHTML(chatFormatWhen(c.last_message_at || c.created_at)) + '</span>' +
              '</span>' +
              '</button>';
          }).join('') + '</div>';
          el.querySelectorAll('.chat-conv-item').forEach(function (btn) {
            btn.addEventListener('click', function () { selectProviderConversation(btn.dataset.conv); });
          });
        }

        async function selectProviderConversation(convId) {
          const conv = chat.providerConvs[convId];
          const el = document.getElementById('chat-messages');
          el.innerHTML = '<div class="chat-empty">' + escapeHTML(t('chat.error.load')) + '</div>';
          if (conv && conv.expired) { renderChatExpired(); return; }
          cleanupChat(); // drop the previous conversation's realtime channel
          try {
            const res = await apiFetch('/api/chat/' + encodeURIComponent(serviceId) +
              '/messages?conversation_id=' + encodeURIComponent(convId));
            chat.conversation = { id: convId, expires_at: conv ? conv.expires_at : null, expired: false };
            document.getElementById('chat-subtitle').textContent = chatFormatExpiry(conv ? conv.expires_at : null);
            renderMessages(res.messages || []);
            subscribeRealtime(convId);
            markRead(convId);
          } catch (err) {
            el.innerHTML = '<div class="chat-empty">' + escapeHTML(err.message) + '</div>';
          }
        }

        function renderMessages(messages) {
          const el = document.getElementById('chat-messages');
          chat.messageIds = new Set();
          chat.oldestAt = null;
          el.innerHTML = '';
          if (!messages.length) {
            chat.hasMore = false;
            el.innerHTML = '<div class="chat-empty">' + t('chat.conv.empty') + '</div>';
            scrollChatBottom();
            return;
          }
          chat.oldestAt = messages[0].created_at;
          chat.hasMore = messages.length >= 40;
          if (chat.hasMore) {
            el.innerHTML = '<button type="button" class="chat-load-older" id="chat-older">' + t('chat.older') + '</button>';
          }
          const frag = document.createDocumentFragment();
          messages.forEach(function (m) { frag.appendChild(buildMessageNode(m)); });
          el.appendChild(frag);
          el.addEventListener('scroll', onChatScroll, { passive: true });
          if (chat.hasMore) {
            document.getElementById('chat-older').addEventListener('click', loadOlderMessages);
          }
          scrollChatBottom();
        }

        function buildMessageNode(m) {
          chat.messageIds.add(m.id);
          const mine = m.sender_id === session.user.id;
          const div = document.createElement('div');
          div.className = 'chat-msg ' + (mine ? 'mine' : 'theirs');
          const p = document.createElement('p');
          p.textContent = m.content; // text only — never parsed as HTML
          const time = document.createElement('span');
          time.className = 'chat-msg-time';
          time.textContent = chatFormatTime(m.created_at);
          div.appendChild(p);
          div.appendChild(time);
          return div;
        }

        function appendMessage(m) {
          if (!m || !m.id || chat.messageIds.has(m.id)) return;
          const el = document.getElementById('chat-messages');
          if (!el) return;
          const empty = el.querySelector('.chat-empty');
          if (empty) empty.remove();
          el.appendChild(buildMessageNode(m));
          if (chat.atBottom) scrollChatBottom(true);
        }

        function onChatScroll() {
          const el = document.getElementById('chat-messages');
          chat.atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 140;
          if (el.scrollTop < 60 && chat.hasMore && !chat.loadingOlder && chat.oldestAt) {
            loadOlderMessages();
          }
        }

        async function loadOlderMessages() {
          if (chat.loadingOlder || !chat.conversation || chat.conversation.expired) return;
          chat.loadingOlder = true;
          const btn = document.getElementById('chat-older');
          if (btn) btn.disabled = true;
          try {
            const res = await apiFetch('/api/chat/' + encodeURIComponent(serviceId) +
              '/messages?conversation_id=' + encodeURIComponent(chat.conversation.id) +
              '&before=' + encodeURIComponent(chat.oldestAt) + '&limit=40');
            const msgs = res.messages || [];
            if (msgs.length < 40) chat.hasMore = false;
            const el = document.getElementById('chat-messages');
            const keep = el.scrollHeight - el.scrollTop;
            const frag = document.createDocumentFragment();
            let newest = chat.oldestAt;
            msgs.forEach(function (m) {
              if (!chat.messageIds.has(m.id)) {
                frag.appendChild(buildMessageNode(m));
                newest = m.created_at;
              }
            });
            if (frag.childNodes.length) el.insertBefore(frag, el.firstChild);
            chat.oldestAt = newest;
            const older = document.getElementById('chat-older');
            if (older && chat.hasMore) older.disabled = false;
            if (older && !chat.hasMore) older.remove();
            el.scrollTop = el.scrollHeight - keep;
          } catch (err) {
            toast(err.message, 'error');
          } finally {
            chat.loadingOlder = false;
          }
        }

        function subscribeRealtime(convId) {
          if (chat.channel) return;
          chat.channel = supabase
            .channel('chat-svc-' + serviceId + '-' + convId)
            .on('postgres_changes', {
              event: 'INSERT',
              schema: 'public',
              table: 'messages',
              filter: 'conversation_id=eq.' + convId
            }, function (payload) {
              const row = payload && payload.new;
              if (!row || !row.id || !row.content) return;
              appendMessage(row);
              if (row.sender_id !== session.user.id) scheduleMarkRead();
            })
            .subscribe();
        }

        function cleanupChat() {
          if (chat.channel) {
            supabase.removeChannel(chat.channel);
            chat.channel = null;
          }
          if (chat.readTimer) { clearTimeout(chat.readTimer); chat.readTimer = null; }
        }

        function scheduleMarkRead() {
          if (chat.readTimer) clearTimeout(chat.readTimer);
          chat.readTimer = setTimeout(function () {
            if (chat.conversation) markRead(chat.conversation.id);
          }, 800);
        }

        async function markRead(convId) {
          if (!convId) return;
          try {
            await apiFetch('/api/chat/' + encodeURIComponent(serviceId) + '/read', {
              method: 'POST',
              body: JSON.stringify({ conversation_id: convId })
            });
          } catch (e) { /* best-effort */ }
        }

        async function sendMessage() {
          const input = document.getElementById('chat-input');
          if (!input || chat.sending) return;
          const text = input.value.trim();
          if (!text) return;
          chat.sending = true;
          const btn = document.getElementById('chat-send');
          btn.disabled = true;
          const body = { content: text };
          if (chat.conversation && chat.conversation.id) body.conversation_id = chat.conversation.id;
          try {
            const res = await apiFetch('/api/chat/' + encodeURIComponent(serviceId) + '/messages', {
              method: 'POST',
              body: JSON.stringify(body)
            });
            input.value = '';
            if (!chat.conversation) {
              // first message — conversation was created server-side
              chat.conversation = { id: res.conversation_id, expires_at: res.expires_at, expired: false };
              document.getElementById('chat-subtitle').textContent = chatFormatExpiry(res.expires_at);
            }
            appendMessage(res.message);
            subscribeRealtime(res.conversation_id);
            markRead(res.conversation_id);
          } catch (err) {
            toast(err.message || t('chat.error.send'), 'error');
          } finally {
            chat.sending = false;
            btn.disabled = false;
            input.focus();
          }
        }

        function renderChatExpired() {
          const el = document.getElementById('chat-messages');
          const composer = document.getElementById('chat-composer');
          if (composer) composer.style.display = 'none';
          el.innerHTML =
            '<div class="chat-expired"><h4>' + t('chat.expired.title') + '</h4>' +
            '<p>' + t('chat.expired.sub') + '</p></div>';
        }

        function chatFormatExpiry(iso) {
          if (!iso) return '';
          const diff = new Date(iso).getTime() - Date.now();
          if (diff <= 0) return t('chat.expired.title');
          const h = Math.floor(diff / 3600000);
          const m = Math.floor((diff % 3600000) / 60000);
          return t('chat.ends') + ' ' + (h ? h + 'h ' : '') + m + 'm';
        }

        function chatFormatTime(iso) {
          const d = new Date(iso);
          const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          if (d.toDateString() === new Date().toDateString()) return hm;
          return d.toLocaleDateString() + ' ' + hm;
        }

        function chatFormatWhen(iso) {
          if (!iso) return '';
          const diff = Date.now() - new Date(iso).getTime();
          const mins = Math.floor(diff / 60000);
          if (mins < 1) return '1m';
          if (mins < 60) return mins + 'm';
          const hours = Math.floor(mins / 60);
          if (hours < 24) return hours + 'h';
          return Math.floor(hours / 24) + 'd';
        }

        function scrollChatBottom(smooth) {
          const el = document.getElementById('chat-messages');
          el.scrollTo({ top: el.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
        }

        function wireChatComposer() {
          const input = document.getElementById('chat-input');
          const sendBtn = document.getElementById('chat-send');
          if (!input || !sendBtn) return;
          sendBtn.addEventListener('click', sendMessage);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          });
          input.addEventListener('input', function () {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 140) + 'px';
          });
        }

        // Real-time expiry countdown for the open conversation (display
        // only — enforcement happens server-side).
        setInterval(function () {
          const sub = document.getElementById('chat-subtitle');
          if (!sub || !chat.conversation || chat.conversation.expired) return;
          if (new Date(chat.conversation.expires_at).getTime() <= Date.now()) {
            chat.conversation.expired = true;
            cleanupChat();
            renderChatExpired();
            return;
          }
          sub.textContent = chatFormatExpiry(chat.conversation.expires_at);
        }, 60000);

        // One listener per page; cleans up the realtime channel when the
        // page is left (prevents duplicate listeners / leaks).
        window.addEventListener('pagehide', cleanupChat);

        wireChatComposer();
      });
    })();
  </script>
</body>
</html>
