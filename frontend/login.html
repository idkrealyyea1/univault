<!DOCTYPE html>
<html lang="en" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studora — Log in</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#faf7ef">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container auth-wrap">
    <div class="auth-card reveal">
      <h1 data-i18n="login.title"></h1>
      <p class="auth-sub" data-i18n="login.sub"></p>

      <form id="login-form">
        <label for="username" data-i18n="login.username"></label>
        <input type="text" id="username" name="username" autocomplete="username" required placeholder="your_username">

        <label for="password" data-i18n="login.password"></label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn" data-i18n="login.submit"></button>
      </form>

      <p class="auth-alt"><span data-i18n="login.noaccount"></span> <a href="./signup.html" data-i18n="nav.signup"></a></p>
      <p class="auth-alt"><a href="./" data-i18n="login.back"></a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/main.js"></script>
  <script>
    (function () {
      renderHeader();
      initScrollReveal();

      const params = new URLSearchParams(location.search);
      const next = params.get('next') || './';

      const form = document.getElementById('login-form');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
          toast(t('login.badusername'), 'error');
          return;
        }
        if (password.length < 8) {
          toast(t('login.badpass'), 'error');
          return;
        }

        btn.disabled = true;
        btn.textContent = t('login.busy');

        const { data, error } = await supabase.auth.signInWithPassword({
          email: username + '@univault.local',
          password: password
        });

        btn.disabled = false;
        btn.textContent = t('login.submit');

        if (error) {
          toast(t('login.invalid'), 'error');
          return;
        }

        if (next && (next.startsWith('/') && !next.startsWith('//') || next.startsWith('./') || next.startsWith('../'))) location.href = next;
        else location.href = './';
      });
    })();
  </script>
</body>
</html>
