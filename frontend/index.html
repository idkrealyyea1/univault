<!DOCTYPE html>
<html lang="en" class="theme-default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studora — Choose Your University</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#faf7ef">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div class="page-bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grid-overlay"></div>
  </div>

  <header id="site-header"></header>

  <section class="hero landing-hero">
    <div class="hero-badge reveal">
      <span class="live-dot"></span> <span data-i18n="hero.badge"></span>
    </div>

    <h1 class="reveal">
      <span data-i18n="hero.h1.1"></span><br>
      <span class="accent" data-i18n="hero.h1.2"></span>
    </h1>

    <p class="hero-sub reveal" data-i18n="hero.sub"></p>

    <div class="hero-actions reveal">
      <a href="#universities" class="btn btn-primary btn-lg"><span data-i18n="hero.browse"></span> <span class="btn-arrow">→</span></a>
      <a href="./login.html" class="btn btn-ghost btn-lg" data-i18n="hero.have"></a>
    </div>

    <div class="hero-chips reveal">
      <span class="chip"><span class="chip-ic">📚</span> <span data-i18n="chip.notes"></span></span>
      <span class="chip"><span class="chip-ic">🧪</span> <span data-i18n="chip.homework"></span></span>
      <span class="chip"><span class="chip-ic">🚀</span> <span data-i18n="chip.project"></span></span>
      <span class="chip"><span class="chip-ic">🔒</span> <span data-i18n="chip.access"></span></span>
    </div>
  </section>

  <div class="marquee" aria-hidden="true">
    <div class="marquee-track" id="marquee-track"></div>
  </div>

  <main class="container">

    <section class="how-it-works" id="how">
      <div class="section-head reveal">
        <span class="section-eyebrow" data-i18n="how.eyebrow"></span>
        <h2 data-i18n="how.title"></h2>
      </div>
      <div class="steps-grid">
        <div class="step-card reveal" style="transition-delay:0ms">
          <span class="step-num">01</span>
          <div class="step-icon">🎓</div>
          <h3 data-i18n="how.step1.title"></h3>
          <p data-i18n="how.step1.body"></p>
        </div>
        <div class="step-card reveal" style="transition-delay:120ms">
          <span class="step-num">02</span>
          <div class="step-icon">🧭</div>
          <h3 data-i18n="how.step2.title"></h3>
          <p data-i18n="how.step2.body"></p>
        </div>
        <div class="step-card reveal" style="transition-delay:240ms">
          <span class="step-num">03</span>
          <div class="step-icon">🗝️</div>
          <h3 data-i18n="how.step3.title"></h3>
          <p data-i18n="how.step3.body"></p>
        </div>
      </div>
    </section>

    <section class="section-head universities-head reveal" id="universities">
      <div class="section-head-text">
        <span class="section-eyebrow" data-i18n="unis.eyebrow"></span>
        <h2 data-i18n="unis.title"></h2>
        <p data-i18n="unis.sub"></p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input type="search" id="uni-filter" class="uni-filter search-filter" placeholder="" data-i18n-ph="unis.search" autocomplete="off">
        <span class="count-pill" id="uni-count"></span>
      </div>
    </section>

    <div id="university-grid" class="university-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <section class="cta-band reveal">
      <div class="cta-band-inner">
        <div>
          <span class="section-eyebrow" data-i18n="cta.eyebrow"></span>
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.sub"></p>
        </div>
        <div class="cta-actions">
          <a href="./signup.html" class="btn btn-primary btn-lg" data-i18n="nav.signup"></a>
          <a href="./login.html" class="btn btn-ghost btn-lg" data-i18n="nav.login"></a>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer landing-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-mark">S</span>
        <strong>Studora</strong>
        <p data-i18n="footer.tag"></p>
      </div>
      <div class="footer-links">
        <a href="#universities" data-i18n="nav.universities"></a>
        <a href="#how" data-i18n="how.title"></a>
        <a href="./login.html" data-i18n="nav.login"></a>
        <a href="./signup.html" data-i18n="nav.signup"></a>
      </div>
    </div>
    <div class="container footer-bottom" data-i18n="footer.copyright"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/main.js"></script>
  <script>
    (async function () {
      await renderHeader();
      initScrollReveal();

      const grid = document.getElementById('university-grid');

      async function load() {
        const { data, error } = await supabase
          .from('universities')
          .select('*')
          .order('name');

        if (error) {
          grid.innerHTML = '<div class="error-panel">Could not load universities: ' + escapeHTML(error.message) + '</div>';
          return;
        }
        if (!data || data.length === 0) {
          grid.innerHTML = '<div class="error-panel">No universities found yet.</div>';
          return;
        }

        document.getElementById('uni-count').textContent = data.length + ' ' + t('unis.count');
        buildMarquee(data);

        grid.innerHTML = data.map(function (u, i) {
          const initials = (u.name.match(/\b\w/g) || ['U']).slice(0, 3).join('');
          const grad = 'grad-' + (i % 6);
          return '<a class="university-card reveal" href="./university.html?u=' + encodeURIComponent(u.slug) + '" style="transition-delay:' + (i * 60) + 'ms" data-search="' + escapeHTML((u.name + ' ' + (u.type || '') + ' ' + (u.description || '')).toLowerCase()) + '">' +
            '  <div class="uni-card-top">' +
            '    <div class="uni-logo ' + grad + '">' + escapeHTML(initials) + '</div>' +
            '    <span class="uni-num">' + String(i + 1).padStart(2, '0') + '</span>' +
            '  </div>' +
            '  <div class="uni-card-body">' +
            '    <p class="uni-type">' + escapeHTML(u.type) + '</p>' +
            '    <h3>' + escapeHTML(u.name) + '</h3>' +
            '    <p class="uni-desc">' + escapeHTML(u.description || '') + '</p>' +
            '  </div>' +
            '  <span class="uni-cta"><span data-i18n="uni.fields">' + t('uni.fields') + '</span><span class="cta-arr">→</span></span>' +
            '</a>';
        }).join('');

        // Live filter by name/type/description
        const filter = document.getElementById('uni-filter');
        if (filter) {
          filter.addEventListener('input', function () {
            const q = filter.value.trim().toLowerCase();
            let shown = 0;
            grid.querySelectorAll('.university-card').forEach(function (card) {
              const hit = !q || (card.dataset.search || '').indexOf(q) !== -1;
              card.style.display = hit ? '' : 'none';
              if (hit) shown++;
            });
            let empty = grid.querySelector('.filter-empty');
            if (shown === 0 && !empty) {
              empty = document.createElement('div');
              empty.className = 'filter-empty';
              empty.textContent = 'No universities match "' + escapeHTML(filter.value.trim()) + '"';
              grid.appendChild(empty);
            } else if (empty) {
              empty.remove();
            }
            const count = document.getElementById('uni-count');
            if (count) count.textContent = q ? shown + ' / ' + data.length + ' ' + t('unis.count') : data.length + ' ' + t('unis.count');
          });
        }

        applyTranslations();
        initScrollReveal();
      }

      function buildMarquee(unis) {
        const names = unis.map(function (u) { return u.name; });
        const half = names.concat(names, names);
        const track = document.getElementById('marquee-track');
        track.innerHTML = half.map(function (n) {
          return '<span class="marquee-item">' + escapeHTML(n) + '<span class="marquee-star">✦</span></span>';
        }).join('');
      }

      load();
    })();
  </script>
</body>
</html>
